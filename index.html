<style>
/* ============================================================
   CHARTE GRAPHIQUE — toutes les valeurs sont ici.
   Pour changer le design du site, modifier uniquement ce bloc.
   ============================================================ */
:root {
  --navy:        #1B2E4B;
  --navy-light:  #253F66;
  --navy-dark:   #132038;
  --gold:        #CBA046;
  --gold-light:  #E3C077;
  --gold-pale:   #FBF6EA;
  --gold-ink:    #8A6620; /* variante foncée du gold, utilisée en texte sur fond clair (contraste AA) */

  --bg:          #F5F4F0;
  --white:       #FFFFFF;
  --gray-50:     #F9F9F7;
  --gray-100:    #EFEFEB;
  --gray-200:    #E3E2DC;
  --gray-300:    #C8C7C0;
  --gray-500:    #6E6D64;
  --gray-700:    #4A4940;
  --gray-900:    #1E1D18;

  --blue:        #1E3A8A;
  --blue-bg:     #EFF6FF;
  --teal:        #0F766E;
  --teal-bg:     #F0FDFA;
  --green:       #15803D;
  --green-bg:    #F0FDF4;
  --amber:       #92400E;
  --amber-bg:    #FFFBEB;
  --red:         #B23A2E;
  --red-bg:      #FBEAEC;

  --font-body:   'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-title:  'Playfair Display', Georgia, serif;

  --radius:      8px;
  --radius-lg:   14px;
  --shadow-sm:   0 1px 2px rgba(0,0,0,.06);
  --shadow:      0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
  --shadow-lg:   0 4px 12px rgba(0,0,0,.08), 0 12px 40px rgba(0,0,0,.10);

  --maxw:        1080px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--gray-900);
  font-size: 15px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

/* ---------- HEADER ---------- */
.site-header {
  background: var(--navy);
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 1px 0 rgba(255,255,255,.06);
}
.site-header::after {
  content: ''; display: block; height: 4px;
  background: linear-gradient(to right,
    var(--red) 0%, var(--red) 33.33%,
    var(--gold) 33.33%, var(--gold) 66.66%,
    var(--red) 66.66%, var(--red) 100%);
}
.header-inner {
  max-width: var(--maxw); margin: 0 auto;
  padding: 12px 20px;
  display: flex; align-items: center; gap: 14px;
}
.brand { display: flex; align-items: center; gap: 11px; cursor: pointer; border: none; background: none; padding: 0; }
.brand-mark {
  width: 34px; height: 34px; background: var(--gold); border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-title); font-size: 17px; font-weight: 700; color: var(--navy);
  flex-shrink: 0;
}
.brand-text { text-align: left; }
.brand-name { font-size: 14.5px; font-weight: 600; color: #fff; letter-spacing: -.01em; line-height: 1.2; }
.brand-tag { font-size: 11px; color: rgba(255,255,255,.5); line-height: 1.2; }

.nav { display: flex; gap: 4px; margin-left: auto; }
.nav-link {
  background: none; border: none; cursor: pointer;
  font-family: var(--font-body); font-size: 13.5px; font-weight: 500;
  color: rgba(255,255,255,.65); padding: 7px 13px; border-radius: 20px;
  transition: .15s;
}
.nav-link:hover { color: #fff; background: rgba(255,255,255,.08); }
.nav-link.active { color: var(--navy); background: var(--gold-light); }

.lang-switch { display: flex; gap: 2px; background: rgba(255,255,255,.08); border-radius: 20px; padding: 3px; }
.lang-btn {
  background: none; border: none; cursor: pointer;
  font-family: var(--font-body); font-size: 11.5px; font-weight: 600;
  color: rgba(255,255,255,.55); padding: 4px 9px; border-radius: 20px;
  transition: .15s; letter-spacing: .03em;
}
.lang-btn:hover { color: #fff; }
.lang-btn.active { background: var(--white); color: var(--navy); }
.lang-btn:disabled { opacity: .35; cursor: not-allowed; }
.lang-btn:disabled:hover { color: rgba(255,255,255,.55); }

.burger { display: none; background: none; border: none; cursor: pointer; padding: 6px; margin-left: auto; }
.burger span { display: block; width: 20px; height: 2px; background: #fff; margin: 4px 0; border-radius: 2px; }

@media (max-width: 720px) {
  .brand-tag { display: none; }
  .nav { order: 3; width: 100%; margin-left: 0; justify-content: center; padding-top: 4px; }
  .header-inner { flex-wrap: wrap; }
  .lang-switch { margin-left: auto; }
}

/* ---------- PAGES ---------- */
.page { display: none; }
.page.active { display: block; animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ---------- HERO ---------- */
.hero { background: var(--navy); padding: 56px 20px 64px; text-align: center; position: relative; overflow: hidden; }
.hero::after {
  content: ''; position: absolute; right: -80px; top: -80px;
  width: 320px; height: 320px; border-radius: 50%;
  border: 40px solid rgba(197,155,71,.05); pointer-events: none;
}
.hero-inner { max-width: 720px; margin: 0 auto; position: relative; }
.hero-flags { font-size: 26px; margin-bottom: 18px; letter-spacing: 4px; color: rgba(255,255,255,.7); }
.hero h1 {
  font-family: var(--font-title); font-weight: 700;
  font-size: clamp(28px, 5vw, 46px); line-height: 1.15; color: #fff;
  letter-spacing: -.02em; margin-bottom: 16px;
}
.hero h1 em { color: var(--gold-light); font-style: italic; }
.hero p { font-size: 16.5px; color: rgba(255,255,255,.62); max-width: 560px; margin: 0 auto; }
.hero-stats { display: flex; justify-content: center; gap: 36px; margin-top: 32px; flex-wrap: wrap; }
.hstat { text-align: center; }
.hstat-val { font-family: var(--font-title); font-size: 24px; font-weight: 700; color: var(--gold-light); line-height: 1.1; }
.hstat-lbl { font-size: 11.5px; color: rgba(255,255,255,.55); text-transform: uppercase; letter-spacing: .08em; max-width: 150px; margin: 4px auto 0; }
.hstat-star .hstat-val { font-size: 34px; }
.hstat-star .hstat-lbl { color: rgba(255,255,255,.7); }

/* ---------- HOME CARDS ---------- */
.home-main { max-width: var(--maxw); margin: 0 auto; padding: 44px 20px 70px; }
.home-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
@media (max-width: 780px) { .home-cards { grid-template-columns: 1fr; } }

.hcard {
  background: var(--white); border-radius: var(--radius-lg); box-shadow: var(--shadow);
  overflow: hidden; display: flex; flex-direction: column;
  transition: transform .18s, box-shadow .18s;
  border: 1px solid var(--gray-100);
}
.hcard:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
.hcard-top { padding: 26px 26px 0; }
.hcard-icon {
  width: 46px; height: 46px; border-radius: 11px;
  display: flex; align-items: center; justify-content: center; font-size: 22px;
  margin-bottom: 14px;
}
.hcard h2 { font-family: var(--font-title); font-size: 21px; font-weight: 600; margin-bottom: 7px; letter-spacing: -.01em; }
.hcard-desc { font-size: 14px; color: var(--gray-700); }
.hcard-list { padding: 16px 26px 0; }
.hcard-li { display: flex; gap: 9px; align-items: flex-start; padding: 5px 0; font-size: 13.5px; color: var(--gray-700); }
.hcard-li::before { content: '✓'; color: var(--teal); font-weight: 700; flex-shrink: 0; }
.hcard-foot { padding: 20px 26px 26px; margin-top: auto; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; height: 44px; border-radius: var(--radius);
  font-family: var(--font-body); font-size: 14px; font-weight: 600;
  cursor: pointer; transition: .15s; border: 2px solid transparent;
}
.btn-primary { background: var(--navy); color: #fff; }
.btn-primary:hover { background: var(--navy-light); }
.btn-outline { background: transparent; border-color: var(--navy); color: var(--navy); }
.btn-outline:hover { background: var(--navy); color: #fff; }

.home-note {
  margin-top: 28px; background: var(--gold-pale); border: 1px solid #EFE0BE;
  border-radius: var(--radius-lg); padding: 18px 22px;
  font-size: 13.5px; color: #6B5218; line-height: 1.6;
}
.home-note strong { color: #4A3810; }

.about-block {
  margin-top: 28px; background: var(--white); border: 1px solid var(--gray-100);
  border-radius: var(--radius-lg); padding: 24px 26px; box-shadow: var(--shadow-sm);
}
.about-badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--gold-ink); margin-bottom: 8px; }
.about-block h2 { font-family: var(--font-title); font-size: 19px; font-weight: 600; color: var(--gray-900); margin-bottom: 10px; letter-spacing: -.01em; }
.about-block p { font-size: 13.5px; color: var(--gray-700); line-height: 1.65; margin-bottom: 10px; }
.about-block p:last-of-type { margin-bottom: 0; }
.about-contact { font-size: 13px; }
.about-contact a { color: var(--navy); font-weight: 600; text-decoration: none; }
.about-contact a:hover { text-decoration: underline; }

.why-block { margin-top: 28px; background: var(--white); border: 1px solid var(--gray-100); border-radius: var(--radius-lg); padding: 26px; box-shadow: var(--shadow-sm); }
.why-eyebrow { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--gold-ink); margin-bottom: 8px; }
.why-title { font-family: var(--font-title); font-size: 20px; font-weight: 600; color: var(--gray-900); margin-bottom: 20px; letter-spacing: -.01em; line-height: 1.3; }
.why-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 24px; }
@media (max-width: 640px) { .why-grid { grid-template-columns: 1fr; } }
.why-item { display: flex; gap: 12px; align-items: flex-start; }
.why-ico { font-size: 22px; line-height: 1.2; flex-shrink: 0; }
.why-it { font-size: 14px; font-weight: 700; color: var(--gray-900); margin-bottom: 3px; }
.why-id { font-size: 12.5px; color: var(--gray-700); line-height: 1.55; }
.why-note { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--gray-100); font-size: 13px; color: var(--gray-700); font-style: italic; }
.home-fresh { margin-top: 16px; text-align: center; font-size: 11.5px; color: var(--gray-500); line-height: 1.6; }
.home-fresh a { color: var(--navy); text-decoration: underline; }

/* ---------- SECTION HEAD ---------- */
.sec-head { background: var(--navy); padding: 38px 20px 44px; text-align: center; }
.sec-head-inner { max-width: 680px; margin: 0 auto; }
.sec-eyebrow { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--gold); margin-bottom: 8px; }
.sec-head h1 { font-family: var(--font-title); font-size: clamp(24px, 4vw, 34px); font-weight: 700; color: #fff; letter-spacing: -.02em; margin-bottom: 10px; }
.sec-head p { font-size: 15px; color: rgba(255,255,255,.6); }

/* ---------- GUIDE ---------- */
.guide-main { max-width: 860px; margin: 0 auto; padding: 32px 20px 70px; }

.content-main { max-width: 760px; margin: 0 auto; padding: 32px 20px 70px; }
.glossary-item {
  background: var(--white); border: 1px solid var(--gray-100); border-radius: var(--radius-lg);
  padding: 16px 20px; margin-bottom: 10px; box-shadow: var(--shadow-sm);
}
.glossary-term { font-family: var(--font-title); font-size: 16px; font-weight: 600; color: var(--navy); }
.glossary-fr { font-size: 12.5px; color: #6B5218; font-style: italic; margin-top: 2px; }
.glossary-def { font-size: 13.5px; color: var(--gray-700); line-height: 1.6; margin-top: 6px; }
.faq-item { margin-bottom: 10px; }
.legal-body {
  background: var(--white); border: 1px solid var(--gray-100); border-radius: var(--radius-lg);
  padding: 26px; box-shadow: var(--shadow-sm); font-size: 13.5px; color: var(--gray-700); line-height: 1.7;
}
.legal-body h3 { font-family: var(--font-title); font-size: 15.5px; color: var(--gray-900); margin: 20px 0 8px; }
.legal-body h3:first-child { margin-top: 0; }
.legal-body p { margin-bottom: 10px; }
.legal-placeholder { background: var(--amber-bg); color: var(--amber); padding: 1px 7px; border-radius: 4px; font-weight: 600; }
.progress-rail {
  display: flex; gap: 6px; margin-bottom: 26px; justify-content: space-between;
  background: var(--white); padding: 12px 16px; border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm); border: 1px solid var(--gray-100);
}
.prail-dot {
  flex: 1 1 0; min-width: 0; height: 30px; border-radius: 15px; border: none; cursor: pointer;
  font-family: var(--font-body); font-size: 12px; font-weight: 600;
  background: var(--gray-100); color: var(--gray-500); transition: .15s;
}
.prail-dot:hover { background: var(--gray-200); color: var(--gray-900); }
.prail-dot.done { background: var(--green-bg); color: var(--green); }
.prail-dot.complete { background: var(--green); color: #fff; }

.step-progress-wrap { margin-bottom: 14px; }
.step-progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--gray-500); margin-bottom: 6px; }
.step-progress-bar { height: 6px; background: var(--gray-100); border-radius: 10px; overflow: hidden; }
.step-progress-fill { height: 100%; background: var(--green); border-radius: 10px; transition: width .2s; }

.step {
  background: var(--white); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
  border: 1px solid var(--gray-100); margin-bottom: 12px; overflow: hidden;
  scroll-margin-top: 90px;
}
.step-row { display: flex; align-items: flex-start; gap: 14px; padding: 18px 20px; }
.step-head {
  display: flex; align-items: flex-start; gap: 14px; flex: 1; min-width: 0;
  cursor: pointer; user-select: none; transition: background .12s;
  background: none; border: none; text-align: left; border-radius: var(--radius);
  font-family: var(--font-body);
}
.step-head:hover { background: var(--gray-50); }
.step-num {
  width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
  background: var(--navy); color: var(--gold-light);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; margin-top: 1px;
  border: none; cursor: pointer; font-family: var(--font-body); transition: .15s;
}
.step-num:hover { background: var(--navy-light); }
.step-num.complete { background: var(--green); color: #fff; font-size: 15px; }
.step-headinfo { flex: 1; min-width: 0; }
.step-title { font-size: 15.5px; font-weight: 600; color: var(--gray-900); letter-spacing: -.01em; line-height: 1.35; }
.step-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.chip { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 20px; white-space: nowrap; }
.chip-time { background: var(--gray-100); color: var(--gray-700); }
.chip-cost { background: var(--gold-pale); color: #6B5218; }
.chip-req  { background: var(--red-bg); color: var(--red); }
.chip-rec  { background: var(--blue-bg); color: var(--blue); }
.chip-opt  { background: var(--gray-100); color: var(--gray-500); }
.step-caret { flex-shrink: 0; color: var(--gray-300); transition: transform .2s; margin-top: 6px; }
.step.open .step-caret { transform: rotate(180deg); color: var(--navy); }
.step-body { display: none; padding: 4px 20px 20px 68px; }
.step.open .step-body { display: block; }
@media (max-width: 620px) { .step-body { padding-left: 20px; } }
.step-body p { font-size: 14px; color: var(--gray-700); margin-bottom: 11px; }
.step-body p:last-child { margin-bottom: 0; }
.step-body strong { color: var(--gray-900); font-weight: 600; }
.step-body ul { margin: 0 0 11px; padding-left: 18px; }
.step-body li { font-size: 14px; color: var(--gray-700); margin-bottom: 4px; }

.callout { border-radius: var(--radius); padding: 11px 14px; margin: 12px 0; font-size: 13px; line-height: 1.6; }
.callout-warn { background: var(--amber-bg); border-left: 3px solid #F59E0B; color: var(--amber); }
.callout-tip  { background: var(--teal-bg);  border-left: 3px solid var(--teal); color: #115E59; }
.callout-key  { background: var(--blue-bg);  border-left: 3px solid var(--blue); color: var(--blue); }
.callout strong { color: inherit; font-weight: 700; }

/* NIE cases */
.case { border: 1px solid var(--gray-200); border-radius: var(--radius); margin-bottom: 8px; overflow: hidden; }
.case summary {
  padding: 10px 14px; cursor: pointer; font-size: 13.5px; font-weight: 600;
  color: var(--gray-900); background: var(--gray-50); list-style: none;
  display: flex; align-items: center; gap: 8px;
}
.case summary::-webkit-details-marker { display: none; }
.case summary::after { content: '+'; margin-left: auto; color: var(--gray-500); font-weight: 400; font-size: 16px; }
.case[open] summary::after { content: '−'; }
.case-body { padding: 12px 14px; border-top: 1px solid var(--gray-200); }
.case-body p { font-size: 13.5px; margin-bottom: 8px; }
.case-body p:last-child { margin-bottom: 0; }

/* Tooltip */
.tip {
  display: inline-flex; align-items: center; justify-content: center;
  width: 15px; height: 15px; border-radius: 50%;
  background: var(--gray-200); color: var(--gray-700);
  font-size: 10px; font-weight: 700; cursor: help;
  vertical-align: 1px; margin-left: 3px; position: relative;
  font-family: var(--font-body); border: none; padding: 0;
  transition: background .12s;
}
.tip:hover, .tip.show { background: var(--navy); color: #fff; }
.tip-pop {
  display: none; position: absolute; bottom: calc(100% + 8px); left: 50%;
  transform: translateX(-50%); width: 240px;
  background: var(--navy-dark); color: #fff; padding: 9px 12px;
  border-radius: var(--radius); font-size: 12px; font-weight: 400; line-height: 1.5;
  text-align: left; white-space: normal; z-index: 50; box-shadow: var(--shadow-lg); cursor: auto;
}
.tip-pop::after {
  content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
  border: 6px solid transparent; border-top-color: var(--navy-dark);
}
.tip-pop b { color: var(--gold-light); display: block; margin-bottom: 2px; font-size: 12px; }
.tip-pop .tip-fr { display: block; color: rgba(255,255,255,.75); font-style: italic; font-size: 11.5px; margin-bottom: 6px; }
.tip:hover .tip-pop, .tip.show .tip-pop { display: block; }
@media (max-width: 520px) { .tip-pop { width: 190px; } }

.gtime-card { margin-bottom: 22px; }
.gtime-total { text-align: center; padding: 16px 20px 4px; }
.gtime-total-v { font-family: var(--font-title); font-size: 27px; font-weight: 700; color: var(--navy); letter-spacing: -.01em; }
.gtime-total-l { font-size: 11.5px; color: var(--gray-500); margin-top: 2px; }
.gtime-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 16px 20px 6px; }
@media (max-width: 480px) { .gtime-grid { grid-template-columns: 1fr; } }
.gtime-note { padding: 10px 20px 16px; font-size: 12px; color: var(--gray-500); line-height: 1.6; }

.guide-cta {
  margin-top: 26px; background: var(--navy); border-radius: var(--radius-lg);
  padding: 26px; text-align: center; color: #fff;
}
.guide-cta h2 { font-family: var(--font-title); font-size: 20px; font-weight: 600; margin-bottom: 6px; }
.guide-cta p { font-size: 14px; color: rgba(255,255,255,.6); margin-bottom: 16px; }
.guide-cta .btn { max-width: 300px; margin: 0 auto; background: var(--gold); color: var(--navy); }
.guide-cta .btn:hover { background: var(--gold-light); }

.interest-cta { margin-top: 20px; }
.interest-form {

.card {

/* Stepper (dévoilement progressif) */

.sim-step .card-head { border-radius: var(--radius-lg) var(--radius-lg) 0 0; }

.step-summary { display: none; }

.step-summary .ck { color: var(--green); font-weight: 700; }
.sim-step.locked .card-head::after { content: '🔒'; float: right; font-size: 13px; opacity: .6; }
.tip-auto { vertical-align: 1px; }
.sim-next { margin-top: 18px; }
.opt-tag { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--gray-500); background: var(--gray-100); padding: 1px 6px; border-radius: 20px; margin-left: 6px; vertical-align: 1px; }
#city { width: 100%; height: 38px; border: 1.5px solid var(--gray-300); border-radius: var(--radius); font-family: var(--font-body); font-size: 13.5px; color: var(--gray-900); background: var(--white); padding: 0 11px; }

input[type=number], input[type=text], select {

.seg-opt { position: relative; }

  t_nota_n: "Nota simple", t_nota_fr: "Extrait du registre foncier", t_nota_d: "Extrait du Registro de la Propiedad indiquant le propriétaire réel, la surface enregistrée, les hypothèques et les charges pesant sur le bien.",
  t_ite_n: "ITE", t_ite_fr: "Contrôle technique des bâtiments", t_ite_d: "Inspección Técnica de Edificios. Contrôle technique obligatoire des immeubles anciens. Un rapport défavorable annonce des travaux votés en copropriété (derramas).",
  t_tasacion_n: "Tasación", t_tasacion_fr: "Expertise immobilière bancaire", t_tasacion_d: "Expertise immobilière officielle, obligatoire pour obtenir un crédit. Coût : 300 à 500 €.",
  t_fnmt_n: "FNMT", t_fnmt_fr: "Organisme émetteur du certificat numérique", t_fnmt_d: "Fábrica Nacional de Moneda y Timbre. Émet le certificat numérique espagnol qui permet de signer et déclarer en ligne.",
  t_nie_n: "NIE", t_nie_fr: "Numéro d'identité d'étranger", t_nie_d: "Número de Identidad de Extranjero. Identifiant fiscal obligatoire pour tout étranger achetant en Espagne.",
  t_ltv_n: "LTV", t_ltv_fr: "Quotité de financement bancaire", t_ltv_d: "Loan To Value : part du prix financée par la banque. Typiquement 60 à 70 % pour un non-résident, contre 80 % pour un résident.",
  t_derrama_n: "Derrama", t_derrama_fr: "Appel de fonds de copropriété", t_derrama_d: "Appel de fonds exceptionnel voté par la copropriété pour financer des travaux. Le nouveau propriétaire hérite des derramas votées avant son achat.",
  t_vpo_n: "VPO", t_vpo_fr: "Logement social à prix encadré", t_vpo_d: "Vivienda de Protección Oficial : logement à prix encadré par l'État. TVA réduite à 4 %, mais revente et location réglementées.",

  foot_disc: "Estimation à titre indicatif. Ce site ne remplace pas les conseils d'un notaire, d'un avocat ou d'un gestor. Les taux fiscaux varient par communauté autonome et changent par décret régional — vérifiez toujours les taux en vigueur auprès de la hacienda autonómica concernée.",

  faq_eyebrow: "Questions fréquentes",
  faq_h1: "Les questions qu'on nous pose le plus",
  faq_sub: "Avant d'écrire, la réponse est peut-être déjà ici.",
  faq: [
    { q:"Peut-on acheter en Espagne sans être résident espagnol ?",
      a:"<p>Oui, sans restriction particulière — que vous soyez de l'UE ou hors UE. La seule démarche obligatoire est d'obtenir un {{NIE}}, décrit à l'étape 2 du guide. Aucune condition de résidence ou de visa n'est requise pour acheter un bien.</p>" },
    { q:"Faut-il parler espagnol pour mener l'achat à bien ?",
      a:"<p>Ce n'est pas indispensable, mais ça aide beaucoup pour lire les documents (nota simple, ITE, contrat) et négocier. Le notaire est légalement tenu de vous fournir un traducteur si vous ne comprenez pas l'acte. Pour les documents en amont, faire appel à un avocat espagnol (200 à 400 € pour une relecture) reste le meilleur rapport sécurité/prix si vous n'êtes pas à l'aise en espagnol.</p>" },
    { q:"Quel budget prévoir en plus du prix affiché ?",
      a:"<p>Comptez 25 à 35 % de plus que le prix affiché une fois additionnés {{ITP}} (ou TVA sur le neuf), notaire, registre, commission d'agence, et frais annexes. Le simulateur de ce site calcule ce montant précisément selon votre région et votre situation.</p>" },
    { q:"Faut-il se déplacer en Espagne pour signer ?",
      a:"<p>Non. Vous pouvez donner procuration à un avocat, un gestor ou un proche, ou signer électroniquement via le portail notarial avec un certificat {{FNMT}} reconnu. Les trois options sont détaillées à l'étape 8 du guide.</p>" },
    { q:"Peut-on obtenir un crédit en Espagne en tant que non-résident ?",
      a:"<p>Oui, mais dans des conditions moins favorables qu'un résident : {{LTV}} généralement limité à 60-70 % du prix (contre 80 % pour un résident), taux légèrement supérieurs, durée souvent plafonnée à 20 ans. Beaucoup de banques ne répondent tout simplement pas aux demandes venues de l'étranger — c'est pourquoi le guide recommande de tester plusieurs banques avant même de trouver un bien.</p>" },
    { q:"Quels sont les pièges les plus fréquents ?",
      a:"<p>Les plus coûteux, d'après le déroulé du guide : sauter la vérification du bien (nota simple, ITE, charges de copropriété) avant de signer les arras ; signer un contrato de arras sans condition suspensive de prêt et perdre 10 % du prix en cas de refus de crédit ; faire des travaux sans facture officielle (perte du droit à amortissement fiscal) ; sous-estimer le budget travaux d'au moins 30 %.</p>" },
    { q:"Comment sont imposés les loyers perçus ?",
      a:"<p>Via l'{{IRNR}}, au taux de 19 % pour les résidents de l'UE/EEE (24 % hors UE, sans droit à déduction). Les résidents UE peuvent déduire de nombreuses charges (intérêts d'emprunt, copropriété, IBI, assurances, gestion, amortissements). Le détail complet est à l'étape 10 du guide.</p>" },
    { q:"Que se passe-t-il fiscalement si je revends le bien ?",
      a:"<p>La plus-value réalisée est imposée, et l'acheteur retient 3 % du prix de vente qu'il reverse directement au fisc espagnol en garantie de cet impôt. Le simulateur permet d'estimer ce montant sur la base d'un prix de revente hypothétique.</p>" }
  ],

  legal_eyebrow: "Informations légales",
  legal_h1: "Mentions légales & confidentialité",
  legal_body: `<h3>Éditeur du site</h3>
    <p>Ce site est édité à titre indépendant. Responsable de la publication : <span class="legal-placeholder">à compléter</span>. Contact : <a class="contact-email-link" href="#"></a>.</p>
    <h3>Hébergement</h3>
    <p>Hébergeur : <span class="legal-placeholder">à compléter une fois le site mis en ligne</span>.</p>
    <h3>Données personnelles</h3>
    <p>Si vous renseignez votre email via le formulaire de ce site, il est transmis à un prestataire tiers (Formspree) qui nous le retransmet. Il n'est utilisé que pour vous recontacter au sujet de ce projet — ni revendu, ni partagé à des fins commerciales. Vous pouvez en demander la suppression à tout moment à l'adresse ci-dessus.</p>
    <h3>Cookies et mesure d'audience</h3>
    <p>Ce site peut utiliser un outil de mesure d'audience respectueux de la vie privée, sans cookies ni collecte de données personnelles, dans le seul but de comprendre l'usage général du site.</p>
    <h3>Propriété intellectuelle</h3>
    <p>L'ensemble des textes, calculs et mises en page de ce site sont protégés. Toute reproduction sans autorisation préalable est interdite.</p>
    <h3>Avertissement</h3>
    <p>Les informations et estimations fournies sur ce site le sont à titre indicatif. Elles ne remplacent pas les conseils d'un notaire, d'un avocat ou d'un gestor. Les taux fiscaux varient par communauté autonome et peuvent changer par décret régional.</p>`,

  steps: [
    { n:1, t:"Définir son projet et son budget réel", time:"1 à 2 semaines", cost:"0 €", badge:"prep",
      body:`<p>La première erreur, c'est de raisonner sur le prix affiché. <strong>Entre le prix d'un bien et ce que vous sortez réellement de votre poche, comptez 25 à 35 % de plus.</strong></p>
      <p>Sur un appartement à 100 000 €, l'investissement total dépasse facilement 132 000 € une fois tout additionné : {{ITP}} régional, notaire et registre, commission d'agence, travaux, mobilier, courtier, expertise, déplacements, imprévus.</p>
      <p>Posez donc la question à l'envers : <strong>« j'ai X € disponibles, ça me donne accès à quel prix d'achat ? »</strong> et non « ce bien coûte X, est-ce que je peux ? ».</p>
      <div class="callout callout-tip"><strong>Le bon réflexe :</strong> divisez votre budget total par 1,32. C'est votre prix d'achat maximum réaliste. Le simulateur de ce site fait le calcul précis selon votre région.</div>
      <p>Décidez aussi maintenant du <strong>type de projet</strong> : résidence secondaire, investissement locatif pur, ou futur pied-à-terre. Ce choix change tout : la région, le type de bien, la fiscalité, et le besoin ou non de gestion locative.</p>` },

    { n:2, t:"Obtenir son NIE", time:"1 jour à 4 mois selon la voie", cost:"9,64 €", badge:"req",
      body:`<p>Le {{NIE}} est le <strong>prérequis absolu</strong>. Sans lui, rien n'est possible : pas de compte bancaire, pas de crédit, pas de signature notariale, pas de déclaration fiscale.</p>
      <p>Il est gratuit en soi ; seule la <em>tasa</em> administrative (modelo 790-012) coûte 9,64 €. Ce qui coûte, c'est le temps.</p>
      <div class="callout callout-warn"><strong>Anticipez.</strong> Le NIE n'est lié à aucun bien précis : demandez-le dès que vous envisagez sérieusement d'acheter, bien avant d'avoir trouvé quoi que ce soit.</div>`,
      cases: [
        { t:"🇪🇸 Vous êtes (ou allez) en Espagne — la voie la plus simple",
          b:`<p><strong>C'est de loin la meilleure option si vous avez un déplacement prévu.</strong> Rendez-vous dans un commissariat de la Policía Nacional habilité aux étrangers. La prise de rendez-vous se fait en ligne sur <em>icp.administracionelectronica.gob.es</em> — rubrique « Policía — Certificados y asignación NIE ».</p>
          <p>Une fois le rendez-vous obtenu, la démarche est <strong>rapide et efficace</strong> : le NIE est souvent délivré le jour même ou sous quelques jours.</p>
          <p>À apporter : formulaire EX-15 rempli, passeport + photocopie intégrale, justificatif du motif économique (mandat de recherche, promesse de vente, ou simple attestation d'intention d'achat), et le justificatif de paiement de la tasa 790-012.</p>
          <div class="callout callout-tip"><strong>Astuce :</strong> les créneaux se libèrent par vagues et partent vite. Regardez plusieurs provinces autour de votre destination — une province voisine moins demandée peut avoir de la place.</div>` },
        { t:"🇫🇷 Vous êtes en France — voie plus lente mais sans déplacement",
          b:`<p>Le consulat général d'Espagne à Paris (22 avenue Marceau) ou celui dont vous dépendez géographiquement délivre le NIE.</p>
          <p><strong>Comptez 2 à 4 mois</strong> entre la prise de rendez-vous et la délivrance, selon l'affluence du consulat. C'est fiable, mais lent.</p>
          <p>Mêmes pièces que pour la voie espagnole : EX-15, passeport et photocopie, justificatif du motif économique, paiement de la tasa.</p>
          <div class="callout callout-warn">Si vous avez un délai de signature contraint, cette voie peut ne pas tenir. Vérifiez le délai réel du consulat <strong>avant</strong> de vous engager sur un calendrier.</div>` },
        { t:"🌍 Vous êtes ailleurs dans l'UE ou hors UE",
          b:`<p>Adressez-vous au consulat d'Espagne de votre pays de résidence. Les délais varient énormément d'un pays à l'autre.</p>
          <p>Autre option : faire coïncider un séjour en Espagne avec la démarche en commissariat, ce qui reste la voie la plus rapide quel que soit votre pays d'origine.</p>
          <p>Il est aussi possible de mandater un avocat ou un <em>gestor</em> espagnol pour faire la demande à votre place, via une procuration. Comptez 150 à 300 € d'honoraires.</p>` }
      ] },

    { n:3, t:"Préparer son dossier bancaire et tester les banques", time:"3 à 6 semaines", cost:"0 €", badge:"rec",
      body:`<p>Cette étape intervient <strong>avant même d'avoir trouvé un bien</strong>. C'est contre-intuitif, mais c'est ce qui sauve les dossiers.</p>
      <p>La raison est simple : obtenir un crédit espagnol quand on est non-résident n'a rien d'automatique. Les sites des banques affichent des offres accueillantes, mais <strong>dans les faits, beaucoup ne répondent tout simplement pas</strong> à une demande venue de l'étranger. Vous pouvez écrire à trois banques et n'avoir aucun retour.</p>
      <p>L'objectif de cette étape n'est donc pas d'obtenir le crédit — c'est de savoir <strong>si vous êtes finançable, à quelle hauteur, et quelle banque vous répond</strong>.</p>
      <div class="callout callout-key"><strong>Le dossier type demandé par une banque espagnole :</strong>
      <ul style="margin:6px 0 0">
        <li>Passeport ou carte d'identité + NIE</li>
        <li>Justificatif de domicile de moins de 3 mois</li>
        <li>Les 2 derniers avis d'imposition</li>
        <li>La déclaration 2042 complète (et non le seul avis)</li>
        <li>3 derniers relevés de compte</li>
        <li>Salariés : 3 derniers bulletins de salaire + contrat de travail</li>
        <li>Indépendants / dirigeants : bilans et comptes de résultat des 3 derniers exercices, attestation comptable (idéalement bilingue), détail des dividendes perçus</li>
        <li>Tableaux d'amortissement et attestations de capital restant dû de tous vos crédits en cours</li>
      </ul></div>
      <div class="callout callout-tip">Si votre structure juridique a changé récemment (passage en SASU, EURL, etc.), <strong>préparez une note explicative</strong>. Une banque espagnole qui voit une société créée il y a 18 mois sans contexte lit ça comme un risque.</div>
      <p>Contactez 3 à 5 banques (CaixaBank, Sabadell, BBVA, Santander, UCI) et notez lesquelles répondent. C'est votre vraie information.</p>
      <div class="callout callout-tip"><strong>Une fois le compte ouvert :</strong> le RIB espagnol vous est remis le jour même du rendez-vous, mais comptez <strong>5 à 7 jours</strong> pour recevoir la carte et le code confidentiel en agence. Anticipez ce délai si vous devez régler des frais rapidement après l'ouverture.</div>` },

    { n:4, t:"Trouver le bien", time:"1 à 6 mois", cost:"0 € (recherche)", badge:"prep",
      body:`<p>Les portails de référence : <strong>Idealista</strong> (le plus complet), <strong>Fotocasa</strong>, <strong>Habitaclia</strong> (fort en Catalogne), <strong>Yaencontre</strong>. Pilotez les alertes par quartier plutôt que par ville — les écarts de prix au m² entre deux quartiers voisins peuvent atteindre 40 %.</p>
      <p><strong>Point important : en Espagne, la commission d'agence est très souvent à la charge de l'acheteur</strong>, contrairement à la pratique française. Comptez 3 à 6 % du prix, parfois un forfait. Posez la question dès le premier contact.</p>
      <div class="callout callout-warn"><strong>Méfiez-vous des rendements affichés.</strong> Les annonces et les dossiers d'investissement présentent presque toujours un rendement <em>brut</em>, calculé sur le seul prix d'achat, sans l'{{IRNR}}, sans les frais de gestion, sans la vacance, et sur des loyers optimistes. L'écart entre le rendement annoncé et le rendement réel est fréquemment de 2 points.</div>
      <p>Vérifiez le prix au m² du quartier sur Idealista (section « informes de precios ») avant de vous positionner. Un bien 20 % sous le marché cache généralement quelque chose : rez-de-chaussée sans lumière, immeuble sans ascenseur, ITE défavorable, ou travaux votés en copropriété.</p>
      <div class="callout callout-key"><strong>La « reserva » ou « señal » : un premier acompte avant même les arras.</strong> Pour marquer sérieusement votre intérêt et geler le bien le temps de finaliser l'accord, il est courant de verser à l'agence ou au vendeur une somme de 1 000 à 3 000 €. Le propriétaire dispose généralement de 2 à 5 jours pour accepter ou refuser. Si l'offre est acceptée, cette somme s'impute sur le prix de vente. Si elle est refusée, l'agence doit vous la rembourser intégralement — exigez-le par écrit avant de payer.</div>` },

    { n:5, t:"Vérifier et faire expertiser le bien", time:"1 à 2 semaines", cost:"0 à 800 €", badge:"req",
      body:`<p>C'est l'étape que l'on saute quand on est pressé, et celle qui coûte le plus cher quand elle a été sautée.</p>
      <p><strong>Les quatre documents à obtenir impérativement avant de verser le moindre euro :</strong></p>
      <ul>
        <li><strong>{{NOTA}}</strong> — Vérifie qui est le vrai propriétaire, la surface enregistrée, et surtout l'existence d'hypothèques ou de saisies. Coût : ~10 € en ligne sur registradores.org.</li>
        <li><strong>{{ITE}}</strong> — Le contrôle technique de l'immeuble. Un rapport <em>desfavorable</em> signifie des travaux à venir, souvent lourds, que vous paierez en tant que copropriétaire.</li>
        <li><strong>Certificat énergétique (CEE)</strong> — Obligatoire à la vente. Un classement F ou G annonce des factures de chauffage élevées, et peut peser sur la revente.</li>
        <li><strong>Certificat de charges de copropriété</strong> — Confirme que le vendeur est à jour, et révèle les {{DERRAMA}} votées. <strong>Les derramas votées avant votre achat vous suivent.</strong></li>
      </ul>
      <div class="callout callout-warn"><strong>Vérifiez la surface réelle.</strong> L'écart entre la surface annoncée sur l'annonce, la surface cadastrale et la surface au Registro est fréquent en Espagne. C'est un levier de négociation, et parfois un problème juridique.</div>
      <p>Si vous achetez à distance et ne parlez pas espagnol, faire relire ces documents par un avocat espagnol coûte 200 à 400 € et reste le meilleur rapport sécurité/prix de toute l'opération.</p>
      <div class="callout callout-tip"><strong>Relecture ponctuelle ou accompagnement complet ?</strong> Les 200 à 400 € couvrent une relecture de documents précis. Si vous préférez un avocat qui vous suit sur toute la transaction — vérifications, présence à la signature, négociation des clauses — comptez plutôt <strong>1 à 3 % du prix du bien</strong> en honoraires globaux. C'est un service différent, pas juste une version plus chère du même service.</div>
      <div class="divider"></div>
      <div class="subhead">L'expertise bancaire (tasación)</div>
      <p>La {{TASACION}} est réalisée par une société agréée par la Banque d'Espagne. Elle est <strong>obligatoire si vous financez à crédit</strong> — la banque ne prêtera jamais sans.</p>
      <p>Elle a deux usages :</p>
      <ul>
        <li><strong>Pour la banque :</strong> déterminer le montant finançable. Attention — la banque prête un pourcentage de la <em>valeur d'expertise</em>, pas du prix payé. Si la tasación est inférieure au prix de vente, votre apport augmente d'autant.</li>
        <li><strong>Pour vous :</strong> une valeur de référence indépendante. C'est un argument de négociation solide si l'expertise arrive sous le prix demandé.</li>
      </ul>
      <div class="callout callout-tip">En achat comptant, la tasación n'est pas obligatoire — mais 400 € pour valider objectivement un investissement à six chiffres reste une dépense raisonnable, surtout si vous n'avez pas visité vous-même.</div>` },

    { n:6, t:"Signer le contrato de arras", time:"1 jour", cost:"10 % du prix (imputé)", badge:"req",
      body:`<p>Le {{ARRAS}} est l'équivalent du compromis de vente. On verse généralement <strong>10 % du prix</strong>, qui viendra en déduction du solde chez le notaire.</p>
      <p>La forme la plus courante est celle des <em>arras penitenciales</em> (art. 1454 du Code civil espagnol), et sa mécanique est brutalement symétrique :</p>
      <div class="callout callout-key"><strong>Vous renoncez</strong> → vous perdez les arrhes versées.<br><strong>Le vendeur renonce</strong> → il vous rembourse le double.</div>
      <div class="callout callout-warn"><strong>Ne signez jamais un contrato de arras sans l'avoir fait relire.</strong> Vérifiez précisément : la date butoir de signature notariale, la présence d'une <strong>condition suspensive d'obtention de prêt</strong> (elle n'est pas automatique en Espagne, contrairement à la France), l'{{IBAN}} du bénéficiaire, et l'état exact du bien livré.</div>
      <p>Si vous n'obtenez pas votre crédit et qu'aucune condition suspensive ne figure au contrat, <strong>vous perdez vos 10 %</strong>. C'est le piège le plus coûteux du parcours.</p>` },

    { n:7, t:"Obtenir le crédit", time:"1 à 3 mois", cost:"0,75 à 1 % du prêt (courtier)", badge:"req",
      body:`<p>Les arras sont signées : <strong>le compteur tourne</strong>. Vous avez généralement 2 à 3 mois jusqu'à la signature notariale, et le temps passe très vite. C'est précisément pour ça que l'étape 3 existe.</p>
      <p>Si vous avez déjà une banque qui vous répond, vous repartez d'une relation amorcée. Sinon, <strong>le courtier devient quasiment indispensable</strong> : il a des contacts directs et débloque des dossiers là où un particulier reste sans réponse. Comptez un forfait fixe (500 à 1 000 €) plus 0,5 à 1 % du montant emprunté.</p>
      <div class="callout callout-tip"><strong>Sur les délais annoncés :</strong> certaines agences d'accompagnement mettent en avant un accord de principe obtenu en 7 jours ouvrables. C'est réaliste — mais uniquement quand le dossier passe par un courtier ou une agence ayant déjà une relation établie avec la banque. En direct et sans intermédiaire, ne vous calez pas sur ce délai : c'est précisément le cas où l'étape 3 fait toute la différence.</div>
      <div class="callout callout-warn"><strong>Le paradoxe des petits montants.</strong> Plus le prêt est petit, plus il est difficile à obtenir — et quasiment impossible à négocier. Sous 70 000 €, beaucoup de banques ne se déplacent pas : le dossier leur coûte autant qu'un prêt de 300 000 € pour une marge dérisoire. Ne comptez pas décrocher les taux affichés en vitrine.</p></div>
      <p>Quelques repères pour un non-résident : {{LTV}} de 60 à 70 % (contre 80 % pour un résident), taux légèrement supérieurs, durée souvent plafonnée à 20 ans.</p>
      <div class="callout callout-key"><strong>Le taux bonifié : lisez les petites lignes.</strong> Les banques espagnoles proposent presque toutes un taux réduit (par exemple 2,95 % au lieu de 3,70 %) en échange de la souscription de leurs produits : assurance vie, assurance habitation, parfois alarme. Faites le calcul complet — l'économie sur les intérêts est souvent largement absorbée par le surcoût des assurances maison. Comparez avec une assurance indépendante avant de signer.</div>
      <p>C'est la banque qui accorde le crédit qui <strong>ouvre votre compte espagnol</strong> dans la foulée. Si vous achetez comptant, il vous faut quand même ouvrir un compte local : il est indispensable pour payer le notaire, l'IBI, les charges de copropriété et encaisser les loyers.</p>` },

    { n:8, t:"Signer chez le notaire", time:"1 jour (jusqu'à 6 semaines si signature électronique)", cost:"1 000 à 2 000 € (notaire + registre)", badge:"req",
      body:`<p>La signature de l'<em>escritura pública</em> transfère la propriété. Le solde du prix se paie le jour même, généralement par <strong>chèque bancaire espagnol</strong> émis par votre banque locale.</p>
      <p><strong>Trois façons de signer :</strong></p>
      <ul>
        <li><strong>Vous déplacer.</strong> Le plus sûr, le plus coûteux. Comptez 600 à 1 200 € de vol, train et hôtel selon la ville. Vous récupérez les clés le jour même.</li>
        <li><strong>Donner procuration (poder notarial).</strong> Un avocat, un gestor ou un proche signe à votre place. La procuration se signe devant un notaire français, puis nécessite une <strong>apostille</strong> et une <strong>traduction assermentée</strong> — comptez 5 à 10 jours ouvrés et 200 à 400 €. Alternative : la signer directement devant un notaire espagnol ou au consulat.</li>
        <li><strong>Signature électronique via le portal notarial.</strong> Possible avec un certificat {{FNMT}} reconnu — voir comment l'obtenir ci-dessous.</li>
      </ul>
      <div class="callout callout-warn"><strong>Le piège du calendrier.</strong> Si vous partez sur la procuration, lancez-la <strong>au moins 3 semaines avant</strong> la date de signature. L'apostille seule prend plusieurs jours ouvrés, et le consulat d'Espagne à Paris fonctionne sur rendez-vous — s'y présenter sans créneau est un pari risqué. Beaucoup d'acheteurs finissent par prendre l'avion en urgence faute d'avoir anticipé.</div>
      <p>À apporter : passeport, NIE, chèque bancaire du solde, et le justificatif de provision pour les frais. Le notaire lit l'acte à voix haute en espagnol — si vous ne comprenez pas, <strong>exigez un traducteur</strong>, c'est votre droit.</p>
      <div class="callout callout-warn"><strong>Le chéquier n'est pas automatique en Espagne.</strong> À la différence de la France, l'usage du chèque y est peu courant et peu de banques en délivrent un par défaut. Demandez-le explicitement à votre banque dès l'ouverture du compte, en précisant que vous en aurez besoin pour le solde chez le notaire.</div>`,
      cases: [
        { t:"🖊️ Obtenir sa signature électronique FNMT (pour signer à distance)",
          b:`<p>Le certificat numérique {{FNMT}} est ce qui vous permettra, depuis la France, de signer des documents officiels et surtout de <strong>déclarer votre IRNR chaque année sans intermédiaire</strong>.</p>
          <p>La demande se fait sur <em>sede.fnmt.gob.es</em> et comporte trois temps : demande en ligne, accréditation d'identité, puis téléchargement du certificat. Comptez <strong>2 à 6 semaines</strong> au total — à lancer bien avant la date de signature visée.</p>
          <div class="callout callout-warn"><strong>Le piège de l'accréditation.</strong> Quatre méthodes sont proposées, mais avec un NIE seul, <strong>une seule fonctionne : l'acreditación presencial</strong>. La vidéo-identification et l'identification par mobile exigent un <em>número de soporte</em> figurant sur la carte de résident espagnole — que vous n'avez pas. Le DNIe est réservé aux ressortissants espagnols.</div>
          <p>L'accréditation présentielle se fait soit au consulat d'Espagne (à Paris, 22 avenue Marceau), soit dans un bureau de l'Agencia Tributaria lors d'un séjour en Espagne. Il faut le NIE et le passeport.</p>
          <div class="callout callout-warn"><strong>Limite importante à connaître :</strong> un certificat FNMT obtenu <em>au consulat</em> n'est pas toujours reconnu par le <strong>portal notarial</strong> espagnol, qui peut exiger une accréditation faite devant un notaire. Si le portail vous refuse, les alternatives sont : une vérification d'identité en présentiel chez un notaire, un certificat d'une entité européenne listée TSL, ou le système Cl@ve PIN.</div>
          <div class="callout callout-tip">Anticipez cette étape très tôt. Le certificat est utile pour la signature, mais il devient <strong>indispensable chaque année</strong> pour l'IRNR — sans lui, vous devrez payer un gestor 80 à 150 € par déclaration.</div>` }
      ] },

    { n:9, t:"Travaux et ameublement", time:"2 semaines à 4 mois selon travaux", cost:"2 000 à 4 000 € (+ travaux si besoin)", badge:"rec",
      body:`<p>C'est le poste où les budgets dérapent le plus. Deux règles de survie.</p>
      <p><strong>Première règle : le budget annoncé est presque toujours sous-évalué.</strong> Pour un appartement de 55 m² à rafraîchir (peinture, électricité, sols, sanitaires), les devis « à partir de 4 000 € » se transforment très vite en 8 000 à 12 000 € une fois les surprises apparues. Prévoyez une marge de 30 %.</p>
      <p><strong>Deuxième règle : sans interlocuteur de confiance sur place, vous ne contrôlez rien.</strong> À distance, vous ne verrez pas qu'un carrelage n'est pas celui prévu, qu'un mur n'a reçu qu'une couche, ou que le chantier n'a pas avancé depuis trois semaines.</p>
      <div class="callout callout-key"><strong>Ce qui fonctionne :</strong>
      <ul style="margin:6px 0 0">
        <li>Un devis <em>détaillé ligne par ligne</em>, avec les références exactes des matériaux — pas un forfait global</li>
        <li>Un paiement échelonné par jalons (30 % / 40 % / 30 %), jamais tout d'avance</li>
        <li>Des photos datées à chaque étape, exigées contractuellement</li>
        <li>Une facture officielle avec IVA — indispensable pour amortir les travaux sur votre IRNR</li>
      </ul></div>
      <div class="callout callout-warn"><strong>Sur la facture :</strong> un artisan qui propose de travailler sans facture affiche un prix plus bas, mais vous perdez la possibilité d'amortir les travaux (3 %/an sur 33 ans) et vous n'avez aucun recours en cas de malfaçon. L'économie apparente est rarement rentable.</div>
      <div class="divider"></div>
      <div class="subhead">Ameublement</div>
      <p>En Espagne, la location meublée est la norme sur le marché locatif urbain. Un bien vide se loue plus lentement et moins cher.</p>
      <p>Les enseignes utiles : <strong>IKEA</strong> (livraison dans toute l'Espagne), <strong>Leroy Merlin ES</strong> pour le second œuvre et le chauffage, <strong>Amazon.es</strong> pour l'électroménager et les petits équipements, <strong>El Corte Inglés</strong> pour le milieu de gamme.</p>
      <div class="callout callout-tip"><strong>Budget réaliste :</strong> 2 000 à 2 500 € pour un T2 correctement équipé, 3 000 à 4 000 € pour un T3. En dessous, vous économisez 500 € et vous perdez un mois de loyer parce que le bien ne se loue pas.</div>
      <p><strong>Le point souvent oublié : le chauffage.</strong> Beaucoup d'appartements espagnols anciens n'ont pas de chauffage central. Si le certificat énergétique du bien est classé F ou G, dimensionnez large : comptez environ 100 W par m² pour un logement mal isolé (soit 2 000 W pour un séjour de 20 m²). En Espagne, les émetteurs muraux se raccordent généralement <strong>en direct au réseau, sans prise</strong> — prévoyez le passage d'un électricien.</p>
      <p>Conservez <strong>toutes les factures</strong> du mobilier et de l'électroménager : ces achats sont amortissables à 10 %/an sur 10 ans en déduction de votre IRNR.</p>` },

    { n:10, t:"Louer le bien et gérer sa fiscalité", time:"2 semaines à 3 mois, puis 1 à 2 h/an", cost:"~10 % des loyers", badge:"req",
      body:`<p>Diffusion : <strong>Idealista</strong> reste le canal dominant, complété par <strong>Fotocasa</strong> et <strong>Badi</strong> pour la colocation.</p>
      <p><strong>Gérer seul ou déléguer ?</strong> À distance et sans espagnol courant, la gestion directe est difficile : visites, sélection du locataire, fuite d'eau un dimanche, relance d'impayé. Une agence de gestion locative prend <strong>8 à 12 % des loyers</strong> (souvent ~10 %) et gère tout, y compris la vérification de solvabilité — qui est le vrai enjeu.</p>
      <div class="callout callout-key"><strong>L'assurance loyers impayés (seguro de impago) est fortement recommandée.</strong> Elle coûte 3 à 5 % du loyer annuel. En Espagne, une procédure d'expulsion (<em>desahucio</em>) prend 8 à 18 mois selon les tribunaux. Sur un loyer de 750 €, l'assurance coûte ~270 €/an et couvre un risque à 10 000 €.</div>
      <p>Intégrez aussi une <strong>vacance locative de 5 à 8 %</strong> dans vos calculs : entre deux locataires, il s'écoule presque toujours quelques semaines. Un rendement calculé sur 12 mois pleins est un rendement théorique.</p>
      <p>Les frais de gestion et l'assurance loyers impayés sont <strong>déductibles de votre IRNR</strong> — leur coût réel est donc inférieur au coût facial.</p>
      <div class="divider"></div>
      <div class="subhead">Fiscalité annuelle</div>
      <p>C'est l'étape que la majorité des acheteurs découvre trop tard. <strong>Être non-résident propriétaire en Espagne crée des obligations fiscales annuelles automatiques.</strong></p>
      <p><strong>Côté espagnol — l'{{IRNR}} via le {{M210}}.</strong> Vous déclarez chaque année vos revenus locatifs et payez <strong>19 %</strong> en tant que résident de l'UE ou de l'EEE (24 % pour les non-UE, et sans droit à déduction). Depuis 2024, la déclaration des revenus locatifs est <strong>annuelle</strong> (elle était trimestrielle auparavant).</p>
      <div class="callout callout-key"><strong>Les charges déductibles pour les résidents UE — c'est là que tout se joue.</strong> Vous pouvez déduire de la base imposable :
      <ul style="margin:6px 0 0">
        <li>Les <strong>intérêts</strong> du crédit (pas le capital)</li>
        <li>Les <strong>charges de copropriété</strong></li>
        <li>L'<strong>{{IBI}}</strong> et les taxes locales</li>
        <li>Les <strong>assurances</strong> (habitation, loyers impayés, emprunteur)</li>
        <li>Les <strong>frais de gestion locative</strong> et honoraires d'agence</li>
        <li>Les <strong>réparations et l'entretien</strong></li>
        <li>Les <strong>amortissements</strong> : 3 %/an sur les travaux (33 ans) et 10 %/an sur le mobilier et l'électroménager (10 ans)</li>
      </ul>
      Ces déductions s'appliquent <strong>au prorata des mois effectivement loués</strong>. Un bien loué 5 mois sur 12 ne déduit que 5/12 de ses charges annuelles.</div>
      <div class="callout callout-warn"><strong>Si le bien n'est pas loué, vous payez quand même.</strong> L'Espagne taxe un revenu fictif (<em>renta imputada</em>) sur les biens à disposition : 1,1 % ou 2 % de la valeur cadastrale, imposé à 19 %. Un bien vide n'est pas un bien neutre fiscalement.</div>
      <p><strong>L'{{IBI}}</strong> se paie séparément, directement à la mairie, une fois par an. Le montant dépend de la valeur cadastrale et de la commune — de 150 à 600 € pour un appartement standard.</p>
      <p><strong>Côté français.</strong> Vous déclarez ces revenus en France, mais la <strong>convention fiscale franco-espagnole de 1995</strong> évite la double imposition : vous obtenez un crédit d'impôt égal à l'impôt français correspondant. Attention cependant — ces revenus <strong>entrent dans le calcul de votre taux marginal</strong> et peuvent donc augmenter l'imposition de vos autres revenus français.</p>
      <div class="callout callout-tip">Avec un certificat {{FNMT}} valide, vous déposez le Modelo 210 vous-même en ligne, gratuitement. Sans certificat, un gestor facture 80 à 150 € par déclaration — soit le prix d'un aller-retour à Madrid tous les cinq ans.</div>
      <p><strong>Un impôt à surveiller si votre patrimoine espagnol grossit :</strong> l'Impuesto sobre el Patrimonio (impôt sur la fortune) ne concerne que les patrimoines détenus en Espagne à partir de 700 000 €. Pour un premier achat locatif, il ne vous concernera probablement pas — mais gardez-le en tête si vous envisagez d'agrandir votre portefeuille espagnol.</p>
      <div class="callout callout-tip"><strong>Une bonne nouvelle pour compenser tout ça :</strong> posséder un bien coûte structurellement moins cher en Espagne qu'en France. L'IBI est généralement 3 à 4 fois inférieur à la taxe foncière française, il n'existe aucun équivalent à la taxe d'habitation, et les charges de copropriété sont typiquement 2 à 3 fois plus basses. La fiscalité française vous manquera sur d'autres points, pas sur celui-là.</div>` }
  ],

  badge_prep: "Préparation", badge_req: "Obligatoire", badge_rec: "Recommandé", badge_opt: "Selon projet"
};

  t_iva_n: "IVA", t_iva_d: "Spanish VAT, applied to new builds (10 %, or 4 % for VPO). Replaces ITP.",
  t_ajd_n: "AJD", t_ajd_d: "Actos Jurídicos Documentados. Stamp duty on notarised deeds, only on new builds. From 0.5 % to 1.5 % depending on the region.",
  t_igic_n: "IGIC", t_igic_d: "Impuesto General Indirecto Canario. The Canary Islands equivalent of VAT, at 7 % instead of 10 %.",
  t_irnr_n: "IRNR", t_irnr_d: "Impuesto sobre la Renta de No Residentes. Spanish tax on non-residents' rental income: 19 % for EU/EEA residents, 24 % elsewhere.",
  t_ibi_n: "IBI", t_ibi_d: "Impuesto sobre Bienes Inmuebles. The local property tax, paid annually to the town hall.",
  t_m210_n: "Modelo 210", t_m210_d: "The IRNR tax return form. Since 2024, rental income is declared annually (previously quarterly).",
  t_arras_n: "Contrato de arras", t_arras_d: "The Spanish preliminary sale contract. Usually 10 % of the price. If the buyer withdraws they lose the deposit; if the seller withdraws they repay double (art. 1454 Spanish Civil Code).",
  t_nota_n: "Nota simple", t_nota_d: "Extract from the Land Registry showing the real owner, registered surface, mortgages and charges on the property.",
  t_ite_n: "ITE", t_ite_d: "Inspección Técnica de Edificios. Mandatory technical inspection of older buildings. An unfavourable report signals works voted by the community (derramas).",
  t_tasacion_n: "Tasación", t_tasacion_d: "Official property valuation, mandatory to obtain a mortgage. Cost: €300 to €500.",
  t_fnmt_n: "FNMT", t_fnmt_d: "Fábrica Nacional de Moneda y Timbre. Issues the Spanish digital certificate that allows online signing and tax filing.",
  t_nie_n: "NIE", t_nie_d: "Número de Identidad de Extranjero. Mandatory tax ID for any foreigner buying in Spain.",
  t_ltv_n: "LTV", t_ltv_d: "Loan To Value: the share of the price financed by the bank. Typically 60 to 70 % for a non-resident, versus 80 % for a resident.",
  t_derrama_n: "Derrama", t_derrama_d: "Exceptional levy voted by the community of owners to fund works. The new owner inherits derramas voted before the purchase.",
  t_vpo_n: "VPO", t_vpo_d: "Vivienda de Protección Oficial: state price-controlled housing. VAT reduced to 4 %, but resale and letting are regulated.",

  foot_disc: "Indicative estimate only. This site does not replace the advice of a notary, lawyer or gestor. Tax rates vary by autonomous community and change by regional decree — always check the current rates with the relevant hacienda autonómica.",

  faq_eyebrow: "Frequently asked questions",
  faq_h1: "The questions we get asked most",
  faq_sub: "Before you write to us, the answer might already be here.",
  faq: [
    { q:"Can you buy in Spain without being a Spanish resident?",
      a:"<p>Yes, with no particular restriction — whether you're from the EU or outside it. The only mandatory step is getting an {{NIE}}, covered in step 2 of the guide. No residency or visa condition is required to buy a property.</p>" },
    { q:"Do you need to speak Spanish to see the purchase through?",
      a:"<p>Not essential, but it helps a lot for reading documents (nota simple, ITE, contract) and negotiating. The notary is legally required to provide a translator if you don't understand the deed. For earlier documents, hiring a Spanish lawyer (€200 to €400 for a review) remains the best security-to-price ratio if you're not comfortable in Spanish.</p>" },
    { q:"What budget should I plan on top of the listed price?",
      a:"<p>Allow 25 to 35 % more than the listed price once you add {{ITP}} (or VAT on new builds), notary, registry, agency commission, and other costs. This site's simulator calculates the precise amount for your region and situation.</p>" },
    { q:"Do you have to travel to Spain to sign?",
      a:"<p>No. You can grant power of attorney to a lawyer, gestor or relative, or sign electronically via the notarial portal with a recognised {{FNMT}} certificate. All three options are detailed in step 8 of the guide.</p>" },
    { q:"Can you get a mortgage in Spain as a non-resident?",
      a:"<p>Yes, but on less favourable terms than a resident: {{LTV}} generally capped at 60-70 % of the price (versus 80 % for a resident), slightly higher rates, term often capped at 20 years. Many banks simply don't reply to enquiries from abroad — which is why the guide recommends testing several banks before you've even found a property.</p>" },
    { q:"What are the most common traps?",
      a:"<p>The costliest ones, based on the guide: skipping the property checks (nota simple, ITE, community fees) before signing the arras; signing a contrato de arras without a mortgage condition precedent and losing 10 % of the price if the loan falls through; having works done without an official invoice (losing the right to tax amortisation); underestimating the renovation budget by at least 30 %.</p>" },
    { q:"How is rental income taxed?",
      a:"<p>Via {{IRNR}}, at 19 % for EU/EEA residents (24 % for non-EU, with no right to deductions). EU residents can deduct many expenses (mortgage interest, community fees, IBI, insurance, management, amortisation). Full detail is in step 10 of the guide.</p>" },
    { q:"What happens tax-wise if I resell the property?",
      a:"<p>The capital gain is taxed, and the buyer withholds 3 % of the sale price, paid directly to the Spanish tax authorities as a guarantee against that tax. The simulator lets you estimate this amount based on a hypothetical resale price.</p>" }
  ],

  legal_h1: "Legal notice & privacy",
