    <p>The information and estimates provided on this site are indicative only. They do not replace the advice of a notary, lawyer or gestor. Tax rates vary by autonomous community and may change by regional decree.</p>`,

  steps: [
    { n:1, t:"Define your project and your real budget", time:"1 to 2 weeks", cost:"€0", badge:"prep",
      body:`<p>The first mistake is to reason on the listed price. <strong>Between the price of a property and what actually leaves your pocket, count on 25 to 35 % more.</strong></p>
      <p>On a €100,000 flat, the total investment easily exceeds €132,000 once everything is added up: regional {{ITP}}, notary and registry, agency commission, works, furniture, broker, valuation, travel, contingency.</p>
      <p>So ask the question the other way round: <strong>“I have €X available, what purchase price does that give me access to?”</strong> rather than “this property costs X, can I afford it?”.</p>
      <div class="callout callout-tip"><strong>The right reflex:</strong> divide your total budget by 1.32. That is your realistic maximum purchase price. This site's simulator does the precise calculation for your region.</div>
      <p>Decide now on the <strong>type of project</strong> too: second home, pure rental investment, or future pied-à-terre. This choice changes everything: the region, the property type, the taxation, and whether you need property management.</p>` },

    { n:2, t:"Get your NIE", time:"1 day to 4 months depending on route", cost:"€9.64", badge:"req",
      body:`<p>The {{NIE}} is the <strong>absolute prerequisite</strong>. Without it, nothing is possible: no bank account, no mortgage, no notarial signing, no tax return.</p>
      <p>It is free in itself; only the administrative <em>tasa</em> (modelo 790-012) costs €9.64. What costs you is time.</p>
      <div class="callout callout-warn"><strong>Plan ahead.</strong> The NIE is not tied to any specific property: apply for it as soon as you seriously consider buying, well before you have found anything.</div>`,
      cases: [
        { t:"🇪🇸 You are (or will be) in Spain — the simplest route",
          b:`<p><strong>By far the best option if you have a trip planned.</strong> Go to a Policía Nacional station authorised for foreigners. Appointments are booked online at <em>icp.administracionelectronica.gob.es</em> — section “Policía — Certificados y asignación NIE”.</p>
          <p>Once you have the appointment, the process is <strong>fast and efficient</strong>: the NIE is often issued the same day or within a few days.</p>
          <p>Bring: completed EX-15 form, passport + full photocopy, proof of economic motive (search mandate, sale agreement, or a simple statement of intent to buy), and proof of payment of the 790-012 tasa.</p>
          <div class="callout callout-tip"><strong>Tip:</strong> slots are released in waves and go fast. Check several provinces around your destination — a less busy neighbouring province may have availability.</div>` },
        { t:"🇫🇷 You are in France — slower but no travel needed",
          b:`<p>The Spanish Consulate General in Paris (22 avenue Marceau) or the one covering your area issues the NIE.</p>
          <p><strong>Allow 2 to 4 months</strong> between booking and issuance, depending on consulate demand. It is reliable, but slow.</p>
          <p>Same documents as the Spanish route: EX-15, passport and photocopy, proof of economic motive, payment of the tasa.</p>
          <div class="callout callout-warn">If you have a tight signing deadline, this route may not hold. Check the consulate's actual lead time <strong>before</strong> committing to a schedule.</div>` },
        { t:"🌍 You are elsewhere in the EU or outside the EU",
          b:`<p>Contact the Spanish consulate in your country of residence. Lead times vary enormously from one country to another.</p>
          <p>Another option: time a stay in Spain with the police station route, which remains the fastest whatever your country of origin.</p>
          <p>You can also instruct a Spanish lawyer or <em>gestor</em> to apply on your behalf, via a power of attorney. Allow €150 to €300 in fees.</p>` }
      ] },

    { n:3, t:"Prepare your bank file and test the banks", time:"3 to 6 weeks", cost:"€0", badge:"rec",
      body:`<p>This step comes <strong>before you have even found a property</strong>. It is counter-intuitive, but it is what saves deals.</p>
      <p>The reason is simple: getting a Spanish mortgage as a non-resident is not automatic. Bank websites display welcoming offers, but <strong>in practice, many simply do not reply</strong> to an enquiry from abroad. You can write to three banks and get no response at all.</p>
      <p>The goal of this step is therefore not to obtain the mortgage — it is to find out <strong>whether you are financeable, up to what amount, and which bank actually replies</strong>.</p>
      <div class="callout callout-key"><strong>The standard file requested by a Spanish bank:</strong>
      <ul style="margin:6px 0 0">
        <li>Passport or ID card + NIE</li>
        <li>Proof of address less than 3 months old</li>
        <li>The last 2 tax assessments</li>
        <li>The complete tax return (not just the assessment notice)</li>
        <li>Last 3 bank statements</li>
        <li>Employees: last 3 payslips + employment contract</li>
        <li>Self-employed / company directors: balance sheets and P&L for the last 3 financial years, accountant's certificate (ideally bilingual), details of dividends received</li>
        <li>Amortisation schedules and outstanding capital statements for all your current loans</li>
      </ul></div>
      <div class="callout callout-tip">If your legal structure changed recently (new company, change of status, etc.), <strong>prepare an explanatory note</strong>. A Spanish bank seeing a company created 18 months ago with no context reads that as a risk.</div>
      <p>Contact 3 to 5 banks (CaixaBank, Sabadell, BBVA, Santander, UCI) and note which ones reply. That is your real information.</p>` },

    { n:4, t:"Find the property", time:"1 to 6 months", cost:"€0 (search)", badge:"prep",
      body:`<p>The main portals: <strong>Idealista</strong> (the most complete), <strong>Fotocasa</strong>, <strong>Habitaclia</strong> (strong in Catalonia), <strong>Yaencontre</strong>. Set alerts by neighbourhood rather than by city — price-per-m² gaps between two adjacent neighbourhoods can reach 40 %.</p>
      <p><strong>Important: in Spain, the agency commission is very often paid by the buyer</strong>, unlike French practice. Allow 3 to 6 % of the price, sometimes a flat fee. Ask the question at first contact.</p>
      <div class="callout callout-warn"><strong>Beware of advertised yields.</strong> Listings and investment dossiers almost always present a <em>gross</em> yield, calculated on the purchase price alone, without {{IRNR}}, without management fees, without vacancy, and on optimistic rents. The gap between the advertised yield and the real yield is frequently 2 points.</div>
      <p>Check the neighbourhood's price per m² on Idealista (“informes de precios” section) before making an offer. A property 20 % below market usually hides something: dark ground floor, building without a lift, unfavourable ITE, or works voted by the community.</p>` },

    { n:5, t:"Check and value the property", time:"1 to 2 weeks", cost:"€0 to €800", badge:"req",
      body:`<p>This is the step people skip when in a hurry, and the one that costs most when skipped.</p>
      <p><strong>The four documents to obtain before paying a single euro:</strong></p>
      <ul>
        <li><strong>{{NOTA}}</strong> — Verifies who the real owner is, the registered surface, and above all the existence of mortgages or seizures. Cost: ~€10 online at registradores.org.</li>
        <li><strong>{{ITE}}</strong> — The building's technical inspection. A <em>desfavorable</em> report means upcoming works, often heavy, which you will pay for as a co-owner.</li>
        <li><strong>Energy certificate (CEE)</strong> — Mandatory on sale. An F or G rating signals high heating bills, and can weigh on resale.</li>
        <li><strong>Community fee certificate</strong> — Confirms the seller is up to date, and reveals any {{DERRAMA}} voted. <strong>Derramas voted before your purchase follow you.</strong></li>
      </ul>
      <div class="callout callout-warn"><strong>Check the actual surface area.</strong> Discrepancies between the advertised surface, the cadastral surface and the Registry surface are frequent in Spain. It is a negotiating lever, and sometimes a legal problem.</div>
      <p>If you are buying remotely and do not speak Spanish, having these documents reviewed by a Spanish lawyer costs €200 to €400 and remains the best security-to-price ratio of the whole operation.</p>
      <div class="divider"></div>
      <div class="subhead">The bank valuation (tasación)</div>
      <p>The {{TASACION}} is carried out by a company approved by the Bank of Spain. It is <strong>mandatory if you are financing with a mortgage</strong> — the bank will never lend without it.</p>
      <p>It has two uses:</p>
      <ul>
        <li><strong>For the bank:</strong> determining the financeable amount. Careful — the bank lends a percentage of the <em>valuation</em>, not of the price paid. If the tasación comes in below the sale price, your cash contribution increases accordingly.</li>
        <li><strong>For you:</strong> an independent reference value. It is a solid negotiating argument if the valuation lands below the asking price.</li>
      </ul>
      <div class="callout callout-tip">For a cash purchase, the tasación is not mandatory — but €400 to objectively validate a six-figure investment remains reasonable, especially if you have not viewed the property yourself.</div>` },

    { n:6, t:"Sign the contrato de arras", time:"1 day", cost:"10 % of price (credited)", badge:"req",
      body:`<p>The {{ARRAS}} is the equivalent of the preliminary sale agreement. You usually pay <strong>10 % of the price</strong>, which is deducted from the balance at the notary.</p>
      <p>The most common form is <em>arras penitenciales</em> (art. 1454 of the Spanish Civil Code), and its mechanics are brutally symmetrical:</p>
      <div class="callout callout-key"><strong>You withdraw</strong> → you lose the deposit paid.<br><strong>The seller withdraws</strong> → they repay you double.</div>
      <div class="callout callout-warn"><strong>Never sign a contrato de arras without having it reviewed.</strong> Check precisely: the deadline for notarial signing, the presence of a <strong>mortgage condition precedent</strong> (it is not automatic in Spain, unlike France), the {{IBAN}} of the beneficiary, and the exact condition of the property delivered.</div>
      <p>If you fail to obtain your mortgage and no condition precedent appears in the contract, <strong>you lose your 10 %</strong>. It is the costliest trap of the whole journey.</p>` },

    { n:7, t:"Secure the mortgage", time:"1 to 3 months", cost:"0.75 to 1 % of loan (broker)", badge:"req",
      body:`<p>The arras are signed: <strong>the clock is ticking</strong>. You generally have 2 to 3 months until the notarial signing, and time goes very fast. That is exactly why step 3 exists.</p>
      <p>If you already have a bank that replies to you, you start from an established relationship. If not, <strong>the broker becomes almost indispensable</strong>: they have direct contacts and unblock files where a private individual gets no answer. Allow a fixed fee (€500 to €1,000) plus 0.5 to 1 % of the amount borrowed.</p>
      <div class="callout callout-warn"><strong>The small-loan paradox.</strong> The smaller the loan, the harder it is to obtain — and almost impossible to negotiate. Below €70,000, many banks will not bother: the file costs them as much as a €300,000 loan for a derisory margin. Do not count on getting the rates advertised in the window.</p></div>
      <p>Some benchmarks for a non-resident: {{LTV}} of 60 to 70 % (versus 80 % for a resident), slightly higher rates, term often capped at 20 years.</p>
      <div class="callout callout-key"><strong>The bonified rate: read the small print.</strong> Spanish banks almost all offer a reduced rate (for example 2.95 % instead of 3.70 %) in exchange for taking out their products: life insurance, home insurance, sometimes an alarm. Do the full calculation — the interest saving is often largely absorbed by the extra cost of the in-house insurance. Compare with independent insurance before signing.</div>
      <p>It is the bank granting the mortgage that <strong>opens your Spanish account</strong> in the process. If you are buying with cash, you still need to open a local account: it is essential to pay the notary, the IBI, the community fees and to receive the rent.</p>` },

    { n:8, t:"Sign at the notary", time:"1 day (up to 6 weeks if signing electronically)", cost:"€1,000 to €2,000 (notary + registry)", badge:"req",
      body:`<p>Signing the <em>escritura pública</em> transfers ownership. The balance of the price is paid the same day, generally by <strong>Spanish bank cheque</strong> issued by your local bank.</p>
      <p><strong>Three ways to sign:</strong></p>
      <ul>
        <li><strong>Travel there.</strong> The safest, the most expensive. Allow €600 to €1,200 for flight, train and hotel depending on the city. You collect the keys the same day.</li>
        <li><strong>Grant a power of attorney (poder notarial).</strong> A lawyer, a gestor or a relative signs on your behalf. The power of attorney is signed before a French notary, then requires an <strong>apostille</strong> and a <strong>sworn translation</strong> — allow 5 to 10 working days and €200 to €400. Alternative: sign it directly before a Spanish notary or at the consulate.</li>
        <li><strong>Electronic signature via the portal notarial.</strong> Possible with a recognised {{FNMT}} certificate — see how to get it below.</li>
      </ul>
      <div class="callout callout-warn"><strong>The calendar trap.</strong> If you go the power-of-attorney route, start it <strong>at least 3 weeks before</strong> the signing date. The apostille alone takes several working days, and the Spanish consulate in Paris works by appointment — turning up without a slot is a risky bet. Many buyers end up taking an emergency flight for lack of planning.</div>
      <p>Bring: passport, NIE, bank cheque for the balance, and proof of provision for the fees. The notary reads the deed aloud in Spanish — if you do not understand, <strong>demand a translator</strong>, it is your right.</p>`,
      cases: [
        { t:"🖊️ Get your FNMT digital signature (to sign remotely)",
          b:`<p>The {{FNMT}} digital certificate is what will allow you, from abroad, to sign official documents and above all to <strong>file your IRNR every year without an intermediary</strong>.</p>
          <p>The application is made at <em>sede.fnmt.gob.es</em> and has three stages: online request, identity accreditation, then certificate download. Allow <strong>2 to 6 weeks</strong> in total — start well before your target signing date.</p>
          <div class="callout callout-warn"><strong>The accreditation trap.</strong> Four methods are offered, but with a NIE alone, <strong>only one works: acreditación presencial</strong>. Video identification and mobile identification require a <em>número de soporte</em> found on the Spanish resident card — which you do not have. The DNIe is reserved for Spanish nationals.</div>
          <p>In-person accreditation is done either at the Spanish consulate (in Paris, 22 avenue Marceau), or at an Agencia Tributaria office during a stay in Spain. You need the NIE and the passport.</p>
          <div class="callout callout-warn"><strong>An important limitation to know:</strong> an FNMT certificate obtained <em>at the consulate</em> is not always recognised by the Spanish <strong>portal notarial</strong>, which may require accreditation carried out before a notary. If the portal refuses you, the alternatives are: an in-person identity check at a notary, a certificate from a European TSL-listed entity, or the Cl@ve PIN system.</div>
          <div class="callout callout-tip">Start this step very early. The certificate is useful for signing, but it becomes <strong>indispensable every year</strong> for the IRNR — without it, you will pay a gestor €80 to €150 per return.</div>` }
      ] },

    { n:9, t:"Renovation and furnishing", time:"2 weeks to 4 months depending on works", cost:"€2,000 to €4,000 (+ renovation if needed)", badge:"rec",
      body:`<p>This is where budgets overrun the most. Two survival rules.</p>
      <p><strong>First rule: the announced budget is almost always underestimated.</strong> For a 55 m² flat needing a refresh (paint, electrics, flooring, bathroom), quotes “from €4,000” quickly turn into €8,000 to €12,000 once the surprises appear. Plan a 30 % margin.</p>
      <p><strong>Second rule: without a trusted contact on the ground, you control nothing.</strong> Remotely, you will not see that the tiling is not the one specified, that a wall only got one coat, or that the site has not moved in three weeks.</p>
      <div class="callout callout-key"><strong>What works:</strong>
      <ul style="margin:6px 0 0">
        <li>A quote <em>itemised line by line</em>, with exact material references — not a global lump sum</li>
        <li>Staged payment by milestones (30 % / 40 % / 30 %), never everything upfront</li>
        <li>Dated photos at each stage, required contractually</li>
        <li>An official invoice with IVA — essential to amortise the works against your IRNR</li>
      </ul></div>
      <div class="callout callout-warn"><strong>On invoicing:</strong> a tradesman offering to work without an invoice shows a lower price, but you lose the ability to amortise the works (3 %/year over 33 years) and you have no recourse in case of defective work. The apparent saving is rarely worth it.</div>
      <div class="divider"></div>
      <div class="subhead">Furnishing</div>
      <p>In Spain, furnished letting is the norm on the urban rental market. An empty property lets more slowly and for less.</p>
      <p>Useful retailers: <strong>IKEA</strong> (delivery across Spain), <strong>Leroy Merlin ES</strong> for fit-out and heating, <strong>Amazon.es</strong> for appliances and small equipment, <strong>El Corte Inglés</strong> for mid-range.</p>
      <div class="callout callout-tip"><strong>Realistic budget:</strong> €2,000 to €2,500 for a properly equipped one-bedroom, €3,000 to €4,000 for a two-bedroom. Below that, you save €500 and lose a month's rent because the property does not let.</div>
      <p><strong>The often-forgotten point: heating.</strong> Many older Spanish flats have no central heating. If the property's energy certificate is rated F or G, size generously: allow roughly 100 W per m² for a poorly insulated home (i.e. 2,000 W for a 20 m² living room). In Spain, wall-mounted emitters are generally <strong>hard-wired, without a plug</strong> — budget for an electrician.</p>
      <p>Keep <strong>all invoices</strong> for furniture and appliances: these purchases are amortisable at 10 %/year over 10 years against your IRNR.</p>` },

    { n:10, t:"Let the property and handle your taxes", time:"2 weeks to 3 months, then 1 to 2 h/year", cost:"~10 % of rent", badge:"req",
      body:`<p>Listing: <strong>Idealista</strong> remains the dominant channel, complemented by <strong>Fotocasa</strong> and <strong>Badi</strong> for house shares.</p>
      <p><strong>Manage alone or delegate?</strong> Remotely and without fluent Spanish, direct management is difficult: viewings, tenant selection, a water leak on a Sunday, chasing arrears. A letting agency takes <strong>8 to 12 % of the rent</strong> (often ~10 %) and handles everything, including the solvency check — which is the real issue.</p>
      <div class="callout callout-key"><strong>Rent default insurance (seguro de impago) is strongly recommended.</strong> It costs 3 to 5 % of the annual rent. In Spain, an eviction procedure (<em>desahucio</em>) takes 8 to 18 months depending on the courts. On a €750 rent, the insurance costs ~€270/year and covers a €10,000 risk.</div>
      <p>Also build in a <strong>vacancy rate of 5 to 8 %</strong> in your calculations: between two tenants, a few weeks almost always pass. A yield calculated on 12 full months is a theoretical yield.</p>
      <p>Management fees and rent default insurance are <strong>deductible from your IRNR</strong> — their real cost is therefore lower than the headline cost.</p>
      <div class="divider"></div>
      <div class="subhead">Annual taxation</div>
      <p>This is the step most buyers discover too late. <strong>Being a non-resident owner in Spain creates automatic annual tax obligations.</strong></p>
      <p><strong>On the Spanish side — {{IRNR}} via {{M210}}.</strong> You declare your rental income every year and pay <strong>19 %</strong> as an EU or EEA resident (24 % for non-EU, with no right to deductions). Since 2024, rental income is declared <strong>annually</strong> (it was quarterly before).</p>
      <div class="callout callout-key"><strong>Deductible expenses for EU residents — this is where it all plays out.</strong> You may deduct from the taxable base:
      <ul style="margin:6px 0 0">
        <li>Mortgage <strong>interest</strong> (not the capital)</li>
        <li><strong>Community fees</strong></li>
        <li><strong>{{IBI}}</strong> and local taxes</li>
        <li><strong>Insurance</strong> (home, rent default, mortgage life)</li>
        <li><strong>Management fees</strong> and agency fees</li>
        <li><strong>Repairs and maintenance</strong></li>
        <li><strong>Amortisation</strong>: 3 %/year on works (33 years) and 10 %/year on furniture and appliances (10 years)</li>
      </ul>
      These deductions apply <strong>pro rata to the months actually let</strong>. A property let 5 months out of 12 only deducts 5/12 of its annual expenses.</div>
      <div class="callout callout-warn"><strong>If the property is not let, you still pay.</strong> Spain taxes a notional income (<em>renta imputada</em>) on properties at your disposal: 1.1 % or 2 % of the cadastral value, taxed at 19 %. An empty property is not tax-neutral.</div>
      <p><strong>{{IBI}}</strong> is paid separately, directly to the town hall, once a year. The amount depends on the cadastral value and the municipality — from €150 to €600 for a standard flat.</p>

      <div class="callout callout-tip">With a valid {{FNMT}} certificate, you file Modelo 210 yourself online, free of charge. Without a certificate, a gestor charges €80 to €150 per return — the price of a return trip to Madrid every five years.</div>` }

    { q:"¿Se puede comprar en España sin ser residente español?",

    <h3>Alojamiento</h3>
    <p>Proveedor de alojamiento: <span class="legal-placeholder">pendiente de completar una vez publicada la web</span>.</p>
    <h3>Datos personales</h3>
    <p>Si indicas tu email en el formulario de esta web, se transmite a un proveedor externo (Formspree) que nos lo reenvía. Solo se usa para contactarte sobre este proyecto — nunca se revende ni se comparte con fines comerciales. Puedes solicitar su eliminación en cualquier momento escribiendo a la dirección anterior.</p>
    <h3>Cookies y medición de audiencia</h3>
    <p>Esta web puede usar una herramienta de medición de audiencia respetuosa con la privacidad, sin cookies ni recogida de datos personales, con el único fin de entender el uso general de la web.</p>
    <h3>Propiedad intelectual</h3>
    <p>Todos los textos, cálculos y maquetación de esta web están protegidos. Queda prohibida su reproducción sin autorización previa.</p>
    <h3>Aviso</h3>
    <p>La información y las estimaciones facilitadas en esta web tienen carácter orientativo. No sustituyen el asesoramiento de un notario, abogado o gestor. Los tipos fiscales varían por comunidad autónoma y pueden cambiar por decreto autonómico.</p>`,

  steps: [
    { n:1, t:"Definir tu proyecto y tu presupuesto real", time:"1 a 2 semanas", cost:"0 €", badge:"prep",
      body:`<p>El primer error es razonar sobre el precio publicado. <strong>Entre el precio de un inmueble y lo que realmente sale de tu bolsillo, cuenta con un 25 a 35 % más.</strong></p>
      <p>En un piso de 100.000 €, la inversión total supera fácilmente los 132.000 € una vez sumado todo: {{ITP}} autonómico, notaría y registro, comisión de agencia, obras, mobiliario, bróker, tasación, desplazamientos, imprevistos.</p>
      <p>Plantea la pregunta al revés: <strong>«tengo X € disponibles, ¿a qué precio de compra me da acceso?»</strong> y no «este inmueble cuesta X, ¿puedo permitírmelo?».</p>
      <div class="callout callout-tip"><strong>El buen reflejo:</strong> divide tu presupuesto total entre 1,32. Ese es tu precio de compra máximo realista. El simulador de esta web hace el cálculo preciso según tu comunidad.</div>
      <p>Decide también ahora el <strong>tipo de proyecto</strong>: segunda residencia, inversión en alquiler pura, o futuro pied-à-terre. Esta elección lo cambia todo: la región, el tipo de inmueble, la fiscalidad, y la necesidad o no de gestión de alquiler.</p>` },

    { n:2, t:"Obtener el NIE", time:"1 día a 4 meses según la vía", cost:"9,64 €", badge:"req",
      body:`<p>El {{NIE}} es el <strong>requisito absoluto</strong>. Sin él, nada es posible: ni cuenta bancaria, ni hipoteca, ni firma notarial, ni declaración fiscal.</p>
      <p>Es gratuito en sí mismo; solo la <em>tasa</em> administrativa (modelo 790-012) cuesta 9,64 €. Lo que cuesta es el tiempo.</p>
      <div class="callout callout-warn"><strong>Anticípate.</strong> El NIE no está vinculado a ningún inmueble concreto: solicítalo en cuanto te plantees seriamente comprar, mucho antes de haber encontrado nada.</div>`,
      cases: [
        { t:"🇪🇸 Estás (o vas) a España — la vía más sencilla",
          b:`<p><strong>Es con diferencia la mejor opción si tienes un viaje previsto.</strong> Acude a una comisaría de la Policía Nacional habilitada para extranjeros. La cita se pide en línea en <em>icp.administracionelectronica.gob.es</em> — apartado «Policía — Certificados y asignación NIE».</p>
          <p>Una vez obtenida la cita, el trámite es <strong>rápido y eficaz</strong>: el NIE se entrega a menudo el mismo día o en pocos días.</p>
          <p>Hay que llevar: formulario EX-15 cumplimentado, pasaporte + fotocopia íntegra, justificante del motivo económico (mandato de búsqueda, contrato de arras, o simple declaración de intención de compra), y el justificante de pago de la tasa 790-012.</p>
          <div class="callout callout-tip"><strong>Consejo:</strong> las citas se liberan por oleadas y vuelan. Mira varias provincias alrededor de tu destino — una provincia vecina menos solicitada puede tener disponibilidad.</div>` },
        { t:"🇫🇷 Estás en Francia — vía más lenta pero sin desplazamiento",
          b:`<p>El Consulado General de España en París (22 avenue Marceau) o el que te corresponda geográficamente expide el NIE.</p>
          <p><strong>Cuenta con 2 a 4 meses</strong> entre la solicitud de cita y la expedición, según la afluencia del consulado. Es fiable, pero lento.</p>
          <p>Mismos documentos que por la vía española: EX-15, pasaporte y fotocopia, justificante del motivo económico, pago de la tasa.</p>
          <div class="callout callout-warn">Si tienes un plazo de firma ajustado, esta vía puede no aguantar. Verifica el plazo real del consulado <strong>antes</strong> de comprometerte con un calendario.</div>` },
        { t:"🌍 Estás en otro país de la UE o fuera de la UE",
          b:`<p>Dirígete al consulado de España de tu país de residencia. Los plazos varían enormemente de un país a otro.</p>
          <p>Otra opción: hacer coincidir una estancia en España con el trámite en comisaría, que sigue siendo la vía más rápida sea cual sea tu país de origen.</p>
          <p>También es posible encargar a un abogado o <em>gestor</em> español que haga la solicitud en tu nombre, mediante un poder. Cuenta con 150 a 300 € de honorarios.</p>` }
      ] },

    { n:3, t:"Preparar tu expediente bancario y tantear a los bancos", time:"3 a 6 semanas", cost:"0 €", badge:"rec",
      body:`<p>Esta etapa se realiza <strong>antes incluso de haber encontrado un inmueble</strong>. Es contraintuitivo, pero es lo que salva las operaciones.</p>
      <p>La razón es sencilla: obtener una hipoteca española siendo no residente no tiene nada de automático. Las webs de los bancos muestran ofertas acogedoras, pero <strong>en la práctica, muchos simplemente no responden</strong> a una solicitud llegada del extranjero. Puedes escribir a tres bancos y no recibir ninguna respuesta.</p>
      <p>El objetivo de esta etapa no es, por tanto, conseguir la hipoteca — es saber <strong>si eres financiable, hasta qué importe, y qué banco te responde</strong>.</p>
      <div class="callout callout-key"><strong>El expediente tipo que pide un banco español:</strong>
      <ul style="margin:6px 0 0">
        <li>Pasaporte o DNI + NIE</li>
        <li>Justificante de domicilio de menos de 3 meses</li>
        <li>Las 2 últimas declaraciones de la renta</li>
        <li>La declaración completa (y no solo el resumen)</li>
        <li>Los 3 últimos extractos bancarios</li>
        <li>Asalariados: 3 últimas nóminas + contrato de trabajo</li>
        <li>Autónomos / administradores: balances y cuentas de resultados de los 3 últimos ejercicios, certificado del asesor contable (idealmente bilingüe), detalle de los dividendos percibidos</li>
        <li>Cuadros de amortización y certificados de capital pendiente de todos tus préstamos en curso</li>
      </ul></div>
      <div class="callout callout-tip">Si tu estructura jurídica ha cambiado recientemente (nueva sociedad, cambio de forma jurídica, etc.), <strong>prepara una nota explicativa</strong>. Un banco español que ve una sociedad creada hace 18 meses sin contexto lo interpreta como un riesgo.</div>
      <p>Contacta con 3 a 5 bancos (CaixaBank, Sabadell, BBVA, Santander, UCI) y anota cuáles responden. Esa es tu verdadera información.</p>` },

    { n:4, t:"Encontrar el inmueble", time:"1 a 6 meses", cost:"0 € (búsqueda)", badge:"prep",
      body:`<p>Los portales de referencia: <strong>Idealista</strong> (el más completo), <strong>Fotocasa</strong>, <strong>Habitaclia</strong> (fuerte en Cataluña), <strong>Yaencontre</strong>. Configura las alertas por barrio en lugar de por ciudad — las diferencias de precio por m² entre dos barrios vecinos pueden alcanzar el 40 %.</p>
      <p><strong>Punto importante: en España, la comisión de agencia recae muy a menudo en el comprador</strong>, a diferencia de la práctica francesa. Cuenta con un 3 a 6 % del precio, a veces una cantidad fija. Pregúntalo en el primer contacto.</p>
      <div class="callout callout-warn"><strong>Desconfía de las rentabilidades anunciadas.</strong> Los anuncios y los dosieres de inversión presentan casi siempre una rentabilidad <em>bruta</em>, calculada solo sobre el precio de compra, sin {{IRNR}}, sin gastos de gestión, sin vacancia, y con rentas optimistas. La diferencia entre la rentabilidad anunciada y la real es con frecuencia de 2 puntos.</div>
      <p>Verifica el precio por m² del barrio en Idealista (sección «informes de precios») antes de posicionarte. Un inmueble un 20 % por debajo del mercado suele esconder algo: bajo sin luz, edificio sin ascensor, ITE desfavorable, u obras aprobadas en comunidad.</p>` },

    { n:5, t:"Verificar y tasar el inmueble", time:"1 a 2 semanas", cost:"0 a 800 €", badge:"req",
      body:`<p>Es la etapa que se salta cuando se tiene prisa, y la que más cara sale cuando se ha saltado.</p>
      <p><strong>Los cuatro documentos que hay que obtener imperativamente antes de pagar un solo euro:</strong></p>
      <ul>
        <li><strong>{{NOTA}}</strong> — Verifica quién es el verdadero propietario, la superficie registrada, y sobre todo la existencia de hipotecas o embargos. Coste: ~10 € en línea en registradores.org.</li>
        <li><strong>{{ITE}}</strong> — La inspección técnica del edificio. Un informe <em>desfavorable</em> significa obras futuras, a menudo importantes, que pagarás como copropietario.</li>
        <li><strong>Certificado energético (CEE)</strong> — Obligatorio en la venta. Una calificación F o G anuncia facturas de calefacción elevadas, y puede pesar en la reventa.</li>
        <li><strong>Certificado de gastos de comunidad</strong> — Confirma que el vendedor está al corriente, y revela las {{DERRAMA}} aprobadas. <strong>Las derramas aprobadas antes de tu compra te siguen.</strong></li>
      </ul>
      <div class="callout callout-warn"><strong>Verifica la superficie real.</strong> La diferencia entre la superficie anunciada, la superficie catastral y la del Registro es frecuente en España. Es una palanca de negociación, y a veces un problema jurídico.</div>
      <p>Si compras a distancia y no hablas español, encargar la revisión de estos documentos a un abogado español cuesta de 200 a 400 € y sigue siendo la mejor relación seguridad/precio de toda la operación.</p>
      <div class="divider"></div>
      <div class="subhead">La tasación bancaria</div>
      <p>La {{TASACION}} la realiza una sociedad homologada por el Banco de España. Es <strong>obligatoria si financias con hipoteca</strong> — el banco nunca prestará sin ella.</p>
      <p>Tiene dos utilidades:</p>
      <ul>
        <li><strong>Para el banco:</strong> determinar el importe financiable. Atención — el banco presta un porcentaje del <em>valor de tasación</em>, no del precio pagado. Si la tasación es inferior al precio de venta, tu aportación aumenta en la misma medida.</li>
        <li><strong>Para ti:</strong> un valor de referencia independiente. Es un argumento de negociación sólido si la tasación queda por debajo del precio pedido.</li>
      </ul>
      <div class="callout callout-tip">En compra al contado, la tasación no es obligatoria — pero 400 € para validar objetivamente una inversión de seis cifras sigue siendo un gasto razonable, sobre todo si no has visitado el inmueble tú mismo.</div>` },

    { n:6, t:"Firmar el contrato de arras", time:"1 día", cost:"10 % del precio (a cuenta)", badge:"req",
      body:`<p>El {{ARRAS}} es el precontrato de compraventa. Se abona generalmente el <strong>10 % del precio</strong>, que se descontará del saldo ante el notario.</p>
      <p>La forma más común es la de las <em>arras penitenciales</em> (art. 1454 del Código Civil), y su mecánica es brutalmente simétrica:</p>
      <div class="callout callout-key"><strong>Tú te retiras</strong> → pierdes las arras entregadas.<br><strong>El vendedor se retira</strong> → te devuelve el doble.</div>
      <div class="callout callout-warn"><strong>Nunca firmes un contrato de arras sin haberlo hecho revisar.</strong> Verifica con precisión: la fecha límite de firma notarial, la presencia de una <strong>condición suspensiva de obtención de hipoteca</strong> (no es automática en España, a diferencia de Francia), el {{IBAN}} del beneficiario, y el estado exacto del inmueble entregado.</div>
      <p>Si no obtienes tu hipoteca y no figura ninguna condición suspensiva en el contrato, <strong>pierdes tu 10 %</strong>. Es la trampa más cara de todo el recorrido.</p>` },

    { n:7, t:"Conseguir la hipoteca", time:"1 a 3 meses", cost:"0,75 a 1 % del préstamo (bróker)", badge:"req",
      body:`<p>Las arras están firmadas: <strong>el reloj corre</strong>. Generalmente tienes de 2 a 3 meses hasta la firma notarial, y el tiempo pasa muy rápido. Precisamente por eso existe la etapa 3.</p>
      <p>Si ya tienes un banco que te responde, partes de una relación iniciada. Si no, <strong>el bróker se vuelve prácticamente indispensable</strong>: tiene contactos directos y desbloquea expedientes donde un particular se queda sin respuesta. Cuenta con una cantidad fija (500 a 1.000 €) más un 0,5 a 1 % del importe prestado.</p>
      <div class="callout callout-warn"><strong>La paradoja de los importes pequeños.</strong> Cuanto más pequeño es el préstamo, más difícil es obtenerlo — y prácticamente imposible negociarlo. Por debajo de 70.000 €, muchos bancos no se molestan: el expediente les cuesta lo mismo que un préstamo de 300.000 € por un margen irrisorio. No cuentes con conseguir los tipos del escaparate.</p></div>
      <p>Algunas referencias para un no residente: {{LTV}} del 60 al 70 % (frente al 80 % de un residente), tipos ligeramente superiores, plazo a menudo limitado a 20 años.</p>
      <div class="callout callout-key"><strong>El tipo bonificado: lee la letra pequeña.</strong> Los bancos españoles ofrecen casi todos un tipo reducido (por ejemplo 2,95 % en lugar de 3,70 %) a cambio de la contratación de sus productos: seguro de vida, seguro de hogar, a veces alarma. Haz el cálculo completo — el ahorro en intereses queda a menudo ampliamente absorbido por el sobrecoste de los seguros de la casa. Compara con un seguro independiente antes de firmar.</div>
      <p>Es el banco que concede la hipoteca el que <strong>abre tu cuenta española</strong> a continuación. Si compras al contado, necesitas igualmente abrir una cuenta local: es imprescindible para pagar la notaría, el IBI, los gastos de comunidad y cobrar las rentas.</p>` },

    { n:8, t:"Firmar ante notario", time:"1 día (hasta 6 semanas si es firma electrónica)", cost:"1.000 a 2.000 € (notaría + registro)", badge:"req",
      body:`<p>La firma de la <em>escritura pública</em> transfiere la propiedad. El saldo del precio se paga el mismo día, generalmente mediante <strong>cheque bancario español</strong> emitido por tu banco local.</p>
      <p><strong>Tres formas de firmar:</strong></p>
      <ul>
        <li><strong>Desplazarte.</strong> Lo más seguro, lo más caro. Cuenta con 600 a 1.200 € de vuelo, tren y hotel según la ciudad. Recoges las llaves el mismo día.</li>
        <li><strong>Otorgar un poder notarial.</strong> Un abogado, un gestor o un allegado firma en tu nombre. El poder se firma ante un notario francés, y luego requiere una <strong>apostilla</strong> y una <strong>traducción jurada</strong> — cuenta con 5 a 10 días hábiles y 200 a 400 €. Alternativa: firmarlo directamente ante un notario español o en el consulado.</li>
        <li><strong>Firma electrónica a través del portal notarial.</strong> Posible con un certificado {{FNMT}} reconocido — mira cómo conseguirlo más abajo.</li>
      </ul>
      <div class="callout callout-warn"><strong>La trampa del calendario.</strong> Si optas por el poder, lánzalo <strong>al menos 3 semanas antes</strong> de la fecha de firma. Solo la apostilla lleva varios días hábiles, y el consulado de España en París funciona con cita previa — presentarse sin hueco es una apuesta arriesgada. Muchos compradores acaban cogiendo el avión de urgencia por no haberlo anticipado.</div>
      <p>Hay que llevar: pasaporte, NIE, cheque bancario del saldo, y el justificante de provisión de fondos para los gastos. El notario lee la escritura en voz alta en español — si no entiendes, <strong>exige un traductor</strong>, es tu derecho.</p>`,
      cases: [
        { t:"🖊️ Obtener tu firma electrónica FNMT (para firmar a distancia)",
          b:`<p>El certificado digital {{FNMT}} es lo que te permitirá, desde el extranjero, firmar documentos oficiales y sobre todo <strong>declarar tu IRNR cada año sin intermediario</strong>.</p>
          <p>La solicitud se hace en <em>sede.fnmt.gob.es</em> y consta de tres tiempos: solicitud en línea, acreditación de identidad, y descarga del certificado. Cuenta con <strong>2 a 6 semanas</strong> en total — empieza mucho antes de la fecha de firma prevista.</p>
          <div class="callout callout-warn"><strong>La trampa de la acreditación.</strong> Se proponen cuatro métodos, pero con un NIE solo, <strong>únicamente funciona uno: la acreditación presencial</strong>. La videoidentificación y la identificación por móvil exigen un <em>número de soporte</em> que figura en la tarjeta de residente español — que no tienes. El DNIe está reservado a los ciudadanos españoles.</div>
          <p>La acreditación presencial se hace bien en el consulado de España (en París, 22 avenue Marceau), bien en una oficina de la Agencia Tributaria durante una estancia en España. Hacen falta el NIE y el pasaporte.</p>
          <div class="callout callout-warn"><strong>Límite importante que conviene conocer:</strong> un certificado FNMT obtenido <em>en el consulado</em> no siempre es reconocido por el <strong>portal notarial</strong> español, que puede exigir una acreditación hecha ante notario. Si el portal te rechaza, las alternativas son: una verificación de identidad presencial ante notario, un certificado de una entidad europea de la lista TSL, o el sistema Cl@ve PIN.</div>
          <div class="callout callout-tip">Anticipa esta etapa muy pronto. El certificado es útil para la firma, pero se vuelve <strong>imprescindible cada año</strong> para el IRNR — sin él, tendrás que pagar a un gestor de 80 a 150 € por declaración.</div>` }
      ] },

    { n:9, t:"Obras y amueblamiento", time:"2 semanas a 4 meses según las obras", cost:"2.000 a 4.000 € (+ obras si hacen falta)", badge:"rec",
      body:`<p>Es la partida donde más se disparan los presupuestos. Dos reglas de supervivencia.</p>
      <p><strong>Primera regla: el presupuesto anunciado está casi siempre infravalorado.</strong> Para un piso de 55 m² a refrescar (pintura, electricidad, suelos, baño), los presupuestos «desde 4.000 €» se convierten muy rápido en 8.000 a 12.000 € una vez aparecen las sorpresas. Prevé un margen del 30 %.</p>
      <p><strong>Segunda regla: sin un interlocutor de confianza sobre el terreno, no controlas nada.</strong> A distancia, no verás que el azulejo no es el previsto, que una pared solo ha recibido una capa, o que la obra no ha avanzado en tres semanas.</p>
      <div class="callout callout-key"><strong>Lo que funciona:</strong>
      <ul style="margin:6px 0 0">
        <li>Un presupuesto <em>detallado línea por línea</em>, con las referencias exactas de los materiales — no una cantidad global</li>
        <li>Un pago escalonado por hitos (30 % / 40 % / 30 %), nunca todo por adelantado</li>
        <li>Fotos fechadas en cada etapa, exigidas contractualmente</li>
        <li>Una factura oficial con IVA — imprescindible para amortizar las obras en tu IRNR</li>
      </ul></div>
      <div class="callout callout-warn"><strong>Sobre la factura:</strong> un profesional que propone trabajar sin factura muestra un precio más bajo, pero pierdes la posibilidad de amortizar las obras (3 %/año durante 33 años) y no tienes ningún recurso en caso de defecto. El ahorro aparente rara vez compensa.</div>
      <div class="divider"></div>
      <div class="subhead">Amueblamiento</div>
      <p>En España, el alquiler amueblado es la norma en el mercado urbano. Un inmueble vacío se alquila más lento y más barato.</p>
      <p>Las tiendas útiles: <strong>IKEA</strong> (envío a toda España), <strong>Leroy Merlin</strong> para acabados y calefacción, <strong>Amazon.es</strong> para electrodomésticos y pequeño equipamiento, <strong>El Corte Inglés</strong> para gama media.</p>
      <div class="callout callout-tip"><strong>Presupuesto realista:</strong> 2.000 a 2.500 € para un piso de un dormitorio bien equipado, 3.000 a 4.000 € para dos dormitorios. Por debajo, ahorras 500 € y pierdes un mes de renta porque el inmueble no se alquila.</div>
      <p><strong>El punto que se olvida a menudo: la calefacción.</strong> Muchos pisos españoles antiguos no tienen calefacción central. Si el certificado energético del inmueble está calificado F o G, dimensiona con holgura: cuenta con unos 100 W por m² en una vivienda mal aislada (es decir, 2.000 W para un salón de 20 m²). En España, los emisores murales se conectan generalmente <strong>directamente a la red, sin enchufe</strong> — prevé el paso de un electricista.</p>
      <p>Conserva <strong>todas las facturas</strong> del mobiliario y los electrodomésticos: estas compras son amortizables al 10 %/año durante 10 años en deducción de tu IRNR.</p>` },

    { n:10, t:"Alquilar el inmueble y gestionar tu fiscalidad", time:"2 semanas a 3 meses, luego 1 a 2 h/año", cost:"~10 % de las rentas", badge:"req",
      body:`<p>Difusión: <strong>Idealista</strong> sigue siendo el canal dominante, complementado por <strong>Fotocasa</strong> y <strong>Badi</strong> para el piso compartido.</p>
      <p><strong>¿Gestionar solo o delegar?</strong> A distancia y sin español fluido, la gestión directa es difícil: visitas, selección del inquilino, una fuga de agua un domingo, reclamar un impago. Una agencia de gestión de alquiler se lleva <strong>del 8 al 12 % de las rentas</strong> (a menudo ~10 %) y lo gestiona todo, incluida la verificación de solvencia — que es lo verdaderamente importante.</p>
      <div class="callout callout-key"><strong>El seguro de impago de alquiler es muy recomendable.</strong> Cuesta del 3 al 5 % de la renta anual. En España, un procedimiento de desahucio lleva de 8 a 18 meses según los tribunales. Sobre una renta de 750 €, el seguro cuesta ~270 €/año y cubre un riesgo de 10.000 €.</div>
      <p>Integra también una <strong>vacancia del 5 al 8 %</strong> en tus cálculos: entre dos inquilinos casi siempre pasan algunas semanas. Una rentabilidad calculada sobre 12 meses completos es una rentabilidad teórica.</p>
      <p>Los gastos de gestión y el seguro de impago son <strong>deducibles de tu IRNR</strong> — su coste real es por tanto inferior al coste nominal.</p>
      <div class="divider"></div>
      <div class="subhead">Fiscalidad anual</div>
      <p>Es la etapa que la mayoría de los compradores descubre demasiado tarde. <strong>Ser propietario no residente en España genera obligaciones fiscales anuales automáticas.</strong></p>
      <p><strong>Del lado español — el {{IRNR}} mediante el {{M210}}.</strong> Declaras cada año tus ingresos por alquiler y pagas un <strong>19 %</strong> como residente de la UE o del EEE (24 % para los no comunitarios, y sin derecho a deducción). Desde 2024, la declaración de ingresos por alquiler es <strong>anual</strong> (antes era trimestral).</p>
      <div class="callout callout-key"><strong>Los gastos deducibles para los residentes de la UE — aquí es donde se juega todo.</strong> Puedes deducir de la base imponible:
      <ul style="margin:6px 0 0">
        <li>Los <strong>intereses</strong> de la hipoteca (no el capital)</li>
        <li>Los <strong>gastos de comunidad</strong></li>
        <li>El <strong>{{IBI}}</strong> y los impuestos locales</li>
        <li>Los <strong>seguros</strong> (hogar, impago, vida)</li>
        <li>Los <strong>gastos de gestión</strong> y honorarios de agencia</li>
        <li>Las <strong>reparaciones y el mantenimiento</strong></li>
        <li>Las <strong>amortizaciones</strong>: 3 %/año sobre las obras (33 años) y 10 %/año sobre mobiliario y electrodomésticos (10 años)</li>
      </ul>

function tip(key) {
  const n = T['t_' + key + '_n'], d = T['t_' + key + '_d'], fr = T['t_' + key + '_fr'];
  if (!n) return '';
  const frLine = fr ? `<span class="tip-fr">🇫🇷 ${fr}</span>` : '';
  return `<span class="tipwrap" style="white-space:nowrap"><strong>${n}</strong><button class="tip" type="button" aria-label="${n}"
    onclick="event.stopPropagation();toggleTip(this)">i<span class="tip-pop"><b>${n}</b>${frLine}${d}</span></button></span>`;
}

function toggleTip(btn) {
  btn.classList.toggle('show');
  const pop = btn.querySelector('.tip-pop');
  pop.style.transform = '';
  if (!btn.classList.contains('show')) return;
  const margin = 8;
  const rect = pop.getBoundingClientRect();
  let shift = 0;
  if (rect.right > window.innerWidth - margin) shift = (window.innerWidth - margin) - rect.right;
  else if (rect.left < margin) shift = margin - rect.left;
  if (shift) pop.style.transform = `translateX(calc(-50% + ${shift}px))`;
}

function expand(html) {
  return html.replace(/\{\{([A-Z0-9]+)\}\}/g, (m, k) => {
    if (k === 'IBAN') return '<strong>IBAN</strong>';
    const key = TOKENS[k];
    return key ? tip(key) : m;
  });
}

function fmt(n) {
  return new Intl.NumberFormat(T._locale, { style:'currency', currency:'EUR', maximumFractionDigits:0 }).format(Math.round(n));
}
function fmtS(n) {
  const s = new Intl.NumberFormat(T._locale, { style:'currency', currency:'EUR', maximumFractionDigits:0 }).format(Math.round(Math.abs(n)));
  return (n < 0 ? '−' : '') + s;
}
function pct(n, d = 2) {

}
/* Versions « PDF-safe » : la police helvetica de jsPDF ne gère pas l'espace fine
   insécable (U+202F) utilisée par Intl comme séparateur de milliers → on la remplace
   par une espace normale (sinon « 7 700 € » s'affiche « 7/700 € » et casse l'alignement). */
const pdfSafe = s => String(s).replace(/[   ]/g, ' ');
function fmtPDF(n)   { return pdfSafe(fmt(n)); }
function fmtSPDF(n)  { return pdfSafe(fmtS(n)); }
function pctPDF(n, d){ return pdfSafe(pct(n, d)); }
/* Nettoie TOUT texte ecrit dans un PDF (montants ET libelles i18n) */
function pdfSafeDoc(doc) {
  const orig = doc.text.bind(doc);
  doc.text = (txt, ...rest) => orig(Array.isArray(txt) ? txt.map(pdfSafe) : pdfSafe(txt), ...rest);
  return doc;
}

/* Barème notarial simplifié (arancel, Orden JUS/1797/2011) + registre */
function estNotary(price) {
  const limits = [6010.13, 30050.61, 60101.21, 150253.03, 601012.10, Infinity];
  const rates  = [null, 0.0045, 0.0015, 0.001, 0.0005, 0.0003];
  let fee = 90, prev = 6010.13;
  for (let i = 1; i < limits.length; i++) {
    if (price <= prev) break;
    fee += (Math.min(price, limits[i]) - prev) * rates[i];
    prev = limits[i];
  }
  const notary = Math.min(Math.max(Math.round(fee * 1.25), 500), 4000);
  const registry = Math.min(Math.max(Math.round(notary * 0.55), 250), 2500);
  return notary + registry;
}

function getITP(id, price) {
  const r = REGIONS[id];
  if (r.itp !== 'tiers') return price * r.itp;
  let tax = 0, prev = 0;
  for (const [lim, rate] of r.tiers) {
    const slice = Math.min(price, lim) - prev;
    if (slice <= 0) break;
    tax += slice * rate; prev = lim;
  }
  return tax;
}

/* Mensualité : annuité constante */
function pmt(principal, annualRate, years) {
  if (principal <= 0 || years <= 0) return 0;
  const r = annualRate / 100 / 12, n = years * 12;
  if (r === 0) return principal / n;
  return principal * r / (1 - Math.pow(1 + r, -n));
}
/* Intérêts payés la 1re année (pour la déduction IRNR) */
function firstYearInterest(principal, annualRate, years) {
  const r = annualRate / 100 / 12;
  const m = pmt(principal, annualRate, years);
  let bal = principal, interest = 0;
  for (let i = 0; i < 12 && bal > 0; i++) {
    const int = bal * r;
    interest += int;
    bal -= (m - int);
  }
  return Math.max(interest, 0);
}

/* ============================================================
   6. CALCUL
   ============================================================ */
function simMode() {
  return document.querySelector('input[name=simmode]:checked').value;
}

/* Contexte des coûts annexes. Les champs auto se recalculent selon le prix testé ;
   les champs modifiés manuellement gardent leur valeur fixe. */
function fixedCostCtx() {
  const cap = id => ({ auto: !autoManual[id], val: num(id) });
  return {
    surface: num('surface'),
    agency: cap('agency'), works: cap('works'), furniture: cap('furniture'), notary: cap('notary'),
    contingency: num('contingency'), travel: num('travel'),
    mort: hasMortgage(), ltv: num('ltv'), brokerFix: num('brokerFix'), brokerPct: num('brokerPct'),
    tasacion: num('tasacion')
  };
}

/* Apport nécessaire pour un prix donné, selon le contexte courant (région, type, financement) */
function regionCostBreakdown(price, regionId, isNew, isVPO, ctx) {
  const region = REGIONS[regionId];
  let mainTax, ajd = 0;
  if (isNew || isVPO) {
    const rate = isVPO ? 0.04 : (region.igic ? region.ivaRate : 0.10);
    mainTax = price * rate;
    ajd = price * region.ajd;
  } else {
    mainTax = getITP(regionId, price);
  }
  const notary      = ctx.notary.auto      ? AUTO.notary(price)              : ctx.notary.val;
  const agency      = ctx.agency.auto      ? AUTO.agency(price)              : ctx.agency.val;
  const works       = ctx.works.auto       ? AUTO.works(price, isNew, isVPO) : ctx.works.val;
  const furniture   = ctx.furniture.auto   ? AUTO.furniture(ctx.surface)     : ctx.furniture.val;
  const loan = ctx.mort ? price * ctx.ltv / 100 : 0;
  const brokerFee = ctx.mort ? ctx.brokerFix + loan * ctx.brokerPct / 100 : 0;
  const tasacion = ctx.mort ? ctx.tasacion : 0;
  const extra = mainTax + ajd + notary + agency + works + furniture + ctx.contingency + ctx.travel + NIE_COST + brokerFee + tasacion;
  const totalInvest = price + extra;
  return { mainTax, ajd, notary, loan, extra, totalInvest, cashNeeded: totalInvest - loan };
}

function cashNeededForPrice(price, regionId, isNew, isVPO, ctx) {
  return regionCostBreakdown(price, regionId, isNew, isVPO, ctx).cashNeeded;
}

function regionCompareRows(d) {
  const ctx = fixedCostCtx();
  return Object.keys(REGIONS)
    .map(id => ({ id, name: REGIONS[id].name, ...regionCostBreakdown(d.price, id, d.isNew, d.isVPO, ctx) }))
    .sort((a, b) => a.totalInvest - b.totalInvest)
    .map(r => `
      <tr class="${r.id === d.regionId ? 'hl' : ''}">
        <td>${r.name}</td>
        <td>${fmt(r.mainTax)}</td>
        <td>${fmt(r.extra)}</td>
        <td>${fmt(r.totalInvest)}</td>
      </tr>`).join('');
}

/* Recherche du prix d'achat maximum atteignable avec un budget donné (dichotomie) */
function solveMaxPrice(budget, regionId, isNew, isVPO, ctx) {
  let lo = 10000, hi = 3000000;
  if (cashNeededForPrice(lo, regionId, isNew, isVPO, ctx) > budget) return 0;
  for (let i = 0; i < 40; i++) {
    const mid = (lo + hi) / 2;
    if (cashNeededForPrice(mid, regionId, isNew, isVPO, ctx) <= budget) lo = mid; else hi = mid;
  }
  return Math.floor(lo / 1000) * 1000;
}

/* Résumé d'une ligne affiché quand une étape est repliée */
function stepSummary(n) {
  if (n === 1) {
    const price = simMode() === 'budget' ? num('budget') : num('price');
    const city = $('city').value.trim();
    const regionSel = $('region');
    const regionName = regionSel.selectedIndex >= 0 ? regionSel.options[regionSel.selectedIndex].text : '';
    return `${fmt(price)}${city ? ' · ' + city : ''}${regionName ? ' · ' + regionName : ''}`;
  }
  if (n === 2) {
    const total = num('agency') + num('notary') + num('works') + num('furniture') + num('contingency') + num('travel');
    return T.step2_sum.replace('{v}', fmt(total));
  }
  if (n === 3) {
    if (!$('tg-mortgage').classList.contains('on')) return T.step3_sum_cash;
    return `${T.f_ltv} ${num('ltv')} % · ${num('years')} ${T.unit_years} · ${num('rate')} %`;
  }
}

/* Dévoilement progressif : valide l'étape n, la replie, puis débloque et défile vers n+1 */
function continueStep(n) {
  if (n === 1) {
    const regionId = $('region').value;
    let ok = true;
    if (simMode() === 'budget') {
      const budget = num('budget');
      $('budget').classList.toggle('error', !(budget >= 5000));
      $('budget-err').classList.toggle('show', !(budget >= 5000));
      if (!(budget >= 5000)) ok = false;
    } else {
      const price = num('price');
      $('price').classList.toggle('error', !(price >= 10000));
      $('price-err').classList.toggle('show', !(price >= 10000));
      if (!(price >= 10000)) ok = false;
    }
    $('region').classList.toggle('error', !regionId);
    $('region-err').classList.toggle('show', !regionId);
    if (!regionId) ok = false;
    if (!ok) return;
    recalcDefaults();
  }
  collapseStep(n);
  const next = $('sim-step-' + (n + 1));
  if (next) {
    next.classList.remove('locked');
    next.removeAttribute('inert');
    next.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function calculate() {
  let ok = true;
  const regionId = $('region').value;
  const type = document.querySelector('input[name=ptype]:checked').value;
  const isNew = type === 'new', isVPO = type === 'vpo';
  const budgetMode = simMode() === 'budget';

  if (budgetMode) {
    const budget = num('budget');
    $('budget').classList.toggle('error', !(budget >= 5000));
    $('budget-err').classList.toggle('show', !(budget >= 5000));
    if (!(budget >= 5000)) ok = false;
    if (ok && regionId) {
      const maxPrice = solveMaxPrice(budget, regionId, isNew, isVPO, fixedCostCtx());
      $('price').value = maxPrice || 10000;
    }
  }

  const price = num('price');

  $('price').classList.toggle('error', !(price >= 10000));
  $('price-err').classList.toggle('show', !(price >= 10000));
  if (!(price >= 10000)) ok = false;

  $('region').classList.toggle('error', !regionId);
  $('region-err').classList.toggle('show', !regionId);
  if (!regionId) ok = false;
  if (!ok) return;

  const region = REGIONS[regionId];

  /* --- Taxes d'acquisition --- */
  let mainTax, mainTaxName, mainTaxDetail, ajd = 0, hasAJD = false;
  if (isNew || isVPO) {
    const rate = isVPO ? 0.04 : (region.igic ? region.ivaRate : 0.10);
    mainTax = price * rate;
    mainTaxName = region.igic && !isVPO ? T.t_igic_n : T.t_iva_n;
    mainTaxDetail = pct(rate * 100, 1);
    hasAJD = true; ajd = price * region.ajd;
  } else {
    mainTax = getITP(regionId, price);
    mainTaxName = T.t_itp_n;
    mainTaxDetail = region.itp === 'tiers' ? pct(mainTax / price * 100) + ' *' : pct(region.itp * 100, 1);
  }

  /* --- Frais --- */
  recalcDefaults();
  const notary = num('notary');
  const agency = num('agency'), works = num('works'), furniture = num('furniture');
  const contingency = num('contingency'), travel = num('travel');

  /* --- Financement --- */
  const mort = hasMortgage();
  const loan = mort ? price * num('ltv') / 100 : 0;
  if (mort) recalcMonthly();
  const monthly = mort ? num('monthly') : 0;
  const brokerFee = mort ? num('brokerFix') + loan * num('brokerPct') / 100 : 0;
  const tasacion = mort ? num('tasacion') : 0;
  const interestY1 = mort ? firstYearInterest(loan, num('rate'), num('years')) : 0;

  const totalTaxes = mainTax + ajd;
  const totalFees = notary + agency + works + furniture + contingency + travel + NIE_COST + brokerFee + tasacion;
  const extra = totalTaxes + totalFees;
  const totalInvest = price + extra;
  const cashNeeded = totalInvest - loan;
  const extraPct = extra / price * 100;

  /* --- Simulation de revente (optionnelle) --- */
  const resalePrice = num('resalePrice');
  let resale = null;
  if (resalePrice > 0) {
    const capitalGain = Math.max(resalePrice - totalInvest, 0);
    const capitalGainTax = capitalGain * IRNR_RATE;
    const withholding = resalePrice * 0.03;
    resale = { resalePrice, capitalGain, capitalGainTax, withholding, balance: capitalGainTax - withholding };
  }

  /* --- Prix au m² vs marché (si ville + surface connues) --- */
  const surface = num('surface');
  const city = cityLookup($('city').value);
  let pricePerM2 = null;
  if (surface > 0) {
    const userM2 = price / surface;
    pricePerM2 = { userM2, cityM2: city ? city.saleM2 : null,
      deltaPct: city ? (userM2 - city.saleM2) / city.saleM2 * 100 : null, cityName: city ? city.n : null };
  }

  /* --- Charges annuelles --- */
  const community = num('community'), ibi = num('ibi');
  const insurance = num('homeIns') + (mort ? num('lifeIns') : 0);
  const mgmtPct = num('mgmtPct') / 100, unpaidPct = num('unpaidPct') / 100, vacPct = num('vacancyPct') / 100;

  const scenarios = ['min','real','max'].map(k => {
    const rent = num(k === 'min' ? 'rentMin' : k === 'real' ? 'rentReal' : 'rentMax');
    const gross = rent * 12;
    const vacancy = gross * vacPct;
    const collected = gross - vacancy;
    const mgmt = collected * mgmtPct;
    const unpaid = collected * unpaidPct;
    const mortgageY = monthly * 12;

    const deductibles = hasDeduct()
      ? community + ibi + insurance + mgmt + unpaid + interestY1 + (works * 0.03) + (furniture * 0.10)
      : 0;
    const taxBase = Math.max(collected - deductibles, 0);
    const irnr = taxBase * IRNR_RATE;

    const cfYear = collected - mortgageY - community - ibi - insurance - mgmt - unpaid - irnr;
    return { k, rent, gross, vacancy, collected, mgmt, unpaid, mortgageY, irnr, cfYear, cfMonth: cfYear / 12 };
  });

  const real = scenarios[1];
  const grossYield = real.gross / totalInvest * 100;
  const netYield = cashNeeded > 0 ? real.cfYear / cashNeeded * 100 : 0;

  /* --- Projection patrimoine sur 30 ans (patrimoine net + rendement total, illustratif) --- */
  const apprec = num('apprecRate') / 100;
  const H = 30, loanRate = num('rate'), loanYears = num('years'), rm = loanRate / 100 / 12;
  function balanceAtYear(y) {
    if (!mort || loan <= 0 || y >= loanYears) return 0;
    const k = y * 12;
    if (rm === 0) return Math.max(loan - monthly * k, 0);
    return Math.max(loan * Math.pow(1 + rm, k) - monthly * ((Math.pow(1 + rm, k) - 1) / rm), 0);
  }
  const series = [];
  for (let y = 0; y <= H; y++) {
    const value = price * Math.pow(1 + apprec, y);
    const bal = balanceAtYear(y);
    series.push({ y, value, bal, equity: value - bal, paid: mort ? Math.max(loan - bal, 0) : 0 });
  }
  const valueH = series[H].value, balH = series[H].bal, equityH = series[H].equity;
  const capitalGainH = valueH - price;
  /* Cash-flow par année : loyers indexés à l'inflation, coûts constants, prêt éteint à son terme */
  const rentInfl = num('rentInflation') / 100;
  let cumCF = 0, breakevenYear = null;
  const cfByYear = [];   // cfByYear[y] = cash-flow annuel de l'année y (1..30)
  for (let y = 1; y <= H; y++) {
    const gross = real.gross * Math.pow(1 + rentInfl, y - 1);
    const vacancy = gross * vacPct, collected = gross - vacancy;
    const mgmt = collected * mgmtPct, unpaid = collected * unpaidPct;
    const mortActive = mort && y <= loanYears;
    const mortgageY = mortActive ? real.mortgageY : 0;
    const deductibles = hasDeduct()
      ? community + ibi + insurance + mgmt + unpaid + (mortActive ? interestY1 : 0) + (works * 0.03) + (furniture * 0.10)
      : 0;
    const irnr = Math.max(collected - deductibles, 0) * IRNR_RATE;
    const cf = collected - mortgageY - community - ibi - insurance - mgmt - unpaid - irnr;
    cfByYear[y] = cf; cumCF += cf;
    if (breakevenYear === null && cf >= 0) breakevenYear = y;
  }
  const cfMilestones = [1, 5, 10, 15, 20, 25, 30].map(y => ({ y, cfMonth: cfByYear[y] / 12 }));
  const tableYears = [0, 5, 10, 15, 20, 25, 30];
  const projection = {
    rate: num('apprecRate'), rentInfl: num('rentInflation'), mort, loan, loanYears, series, valueH, balH, equityH,
    capitalGainH, cumCF, cfByYear, apport: cashNeeded, cfMilestones, tableYears, breakevenYear, horizon: H,
    netGain: equityH + cumCF - cashNeeded   // bilan réel : patrimoine final + cash-flow cumulé − apport
  };

  const notes = [];
  if (region.note) notes.push(T[region.note]);
  if (hasDeduct()) notes.push(T.f_deduct_hint);

  lastCalc = {
    price, regionId, region, type, isNew, isVPO,
    mainTax, mainTaxName, mainTaxDetail, hasAJD, ajd,
    notary, agency, works, furniture, contingency, travel, brokerFee, tasacion,
    mort, loan, monthly, interestY1,
    totalTaxes, totalFees, extra, totalInvest, cashNeeded, extraPct,
    community, ibi, insurance, scenarios, real, grossYield, netYield, notes,
    budgetMode, budget: budgetMode ? num('budget') : null, resale,
    surface, pricePerM2, projection
  };
  render(lastCalc);
}

/* Appelé par le bouton final : calcule puis fait défiler vers les résultats */
function runCalc() {
  calculate();
  if (lastCalc) requestAnimationFrame(() => $('res-content').scrollIntoView({ behavior: 'smooth', block: 'start' }));
}

/* Graphique SVG : évolution du cash-flow mensuel (barres) à aujourd'hui / +5 / +10 / +15 / +20 ans.
   Rouge sous zéro, vert au-dessus. Les loyers indexés à l'inflation font remonter les barres. */
function cashflowChart(ms) {
  const W = 340, H = 152, padL = 8, padR = 8, padT = 22, padB = 30;
  const vals = ms.map(m => m.cfMonth);
  const maxPos = Math.max(0, ...vals), minNeg = Math.min(0, ...vals);
  const range = (maxPos - minNeg) || 1;
  const plotH = H - padT - padB;
  const zeroY = padT + (maxPos / range) * plotH;
  const scale = plotH / range;
  const n = ms.length, slot = (W - padL - padR) / n, bw = Math.min(44, slot * 0.58);
  const bars = ms.map((m, i) => {
    const cx = padL + slot * i + slot / 2;
    const yv = zeroY - m.cfMonth * scale;
    const pos = m.cfMonth >= 0;
    const barY = pos ? yv : zeroY;
    const barH = Math.max(Math.abs(zeroY - yv), 2);
    const col = pos ? 'var(--green)' : '#B23A2E';
    const lbl = m.y === 1 ? T.cf_evo_now : T.cf_evo_yr.replace('{n}', m.y);
    const valY = pos ? barY - 5 : barY + barH + 12;
    return `<rect x="${(cx - bw / 2).toFixed(1)}" y="${barY.toFixed(1)}" width="${bw.toFixed(1)}" height="${barH.toFixed(1)}" rx="2.5" fill="${col}"/>`
      + `<text x="${cx.toFixed(1)}" y="${valY.toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${col}">${fmtS(Math.round(m.cfMonth))}</text>`
      + `<text x="${cx.toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="9.5" fill="var(--gray-500)">${lbl}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" role="img" aria-label="${T.cf_evo_title}">`
    + `<line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${W - padR}" y2="${zeroY.toFixed(1)}" stroke="var(--gray-300)" stroke-width="1" stroke-dasharray="3 3"/>`
    + bars + `</svg>`;
}

/* Graphique SVG : patrimoine net (aire verte) empilé sur le capital restant dû (aire grise),
   de aujourd'hui à +30 ans. Sommet = valeur du bien. Un repère marque l'année de fin de prêt. */
function projectionChart(p) {
  const S = p.series, horizon = p.horizon;
  const W = 320, H = 150, padL = 6, padR = 6, padT = 24, padB = 30;
  const vmax = Math.max(...S.map(s => s.value)) || 1;
  const X = y => padL + y / horizon * (W - padL - padR);
  const Y = v => padT + (1 - v / vmax) * (H - padT - padB);
  const base = (H - padB).toFixed(1);
  const balLine = S.map(s => `${X(s.y).toFixed(1)},${Y(s.bal).toFixed(1)}`).join(' ');
  const valLine = S.map(s => `${X(s.y).toFixed(1)},${Y(s.value).toFixed(1)}`).join(' ');
  const balLineRev = S.slice().reverse().map(s => `${X(s.y).toFixed(1)},${Y(s.bal).toFixed(1)}`).join(' ');
  const balArea = `${X(0).toFixed(1)},${base} ${balLine} ${X(horizon).toFixed(1)},${base}`;
  const equityArea = `${valLine} ${balLineRev}`;
  const mid = Math.round(horizon / 2);
  const lbl = (y, v, anchor, dy) => `<text x="${X(y).toFixed(1)}" y="${(Y(v) + dy).toFixed(1)}" text-anchor="${anchor}" font-size="9" font-weight="700" fill="var(--navy)">${fmt(Math.round(v))}</text>`;
  const xlbl = (y, s, anchor) => `<text x="${X(y).toFixed(1)}" y="${H - 8}" text-anchor="${anchor}" font-size="8.5" fill="var(--gray-500)">${s}</text>`;
  const showDebt = p.mort && p.balH >= 0 && S[0].bal > 0;
  const payoffMarker = showDebt && p.loanYears > 0 && p.loanYears < horizon
    ? `<line x1="${X(p.loanYears).toFixed(1)}" y1="${padT}" x2="${X(p.loanYears).toFixed(1)}" y2="${base}" stroke="var(--gold)" stroke-width="1.2" stroke-dasharray="2 2"/>
       <text x="${X(p.loanYears).toFixed(1)}" y="${padT - 8}" text-anchor="middle" font-size="8.5" font-weight="700" fill="var(--gold)">${T.proj_legend_payoff}</text>`
    : '';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" role="img" aria-label="${T.proj_title}">
    <polygon points="${equityArea}" fill="rgba(21,128,61,.14)"/>
    ${showDebt ? `<polygon points="${balArea}" fill="rgba(138,137,128,.22)"/>
    <polyline points="${balLine}" fill="none" stroke="var(--gray-500)" stroke-width="1.5" stroke-dasharray="2 2"/>` : ''}
    <polyline points="${valLine}" fill="none" stroke="var(--green)" stroke-width="2"/>
    ${payoffMarker}
    <circle cx="${X(0).toFixed(1)}" cy="${Y(S[0].value).toFixed(1)}" r="3.5" fill="var(--navy)"/>
    <circle cx="${X(mid).toFixed(1)}" cy="${Y(S[mid].value).toFixed(1)}" r="3" fill="var(--green)"/>
    <circle cx="${X(horizon).toFixed(1)}" cy="${Y(p.valueH).toFixed(1)}" r="3.5" fill="var(--green)"/>
    ${lbl(0, S[0].value, 'start', -6)}
    ${lbl(mid, S[mid].value, 'middle', -10)}
    ${lbl(horizon, p.valueH, 'end', -6)}
    ${xlbl(0, T.proj_x_now, 'start')}
    ${xlbl(mid, T.proj_x_mid, 'middle')}
    ${xlbl(horizon, T.proj_x_future, 'end')}
  </svg>`;
}

    </div>

    <div class="bsec">

    })() : ''}

    ${d.pricePerM2 && d.pricePerM2.cityM2 ? (() => {
      const p = d.pricePerM2, dp = p.deltaPct;
      const cls = dp <= -8 ? 'sa-good' : dp >= 8 ? 'sa-warn' : 'sa-info';
      const verdict = dp <= -8 ? T.ppm2_below : dp >= 8 ? T.ppm2_above : T.ppm2_around;
      return `<div class="sim-alert ${cls}">📍 ${T.ppm2_label.replace('{u}', fmt(Math.round(p.userM2))).replace('{city}', p.cityName).replace('{c}', fmt(p.cityM2))} <strong>${verdict}</strong> (${dp >= 0 ? '+' : ''}${pct(dp, 0)})</div>`;
    })() : ''}

    ${d.projection && d.price > 0 ? (() => {
      const pj = d.projection;
      const showDebt = pj.mort && pj.series[0].bal > 0;
      const eqSentence = showDebt
        ? T.proj_equity_full.replace('{e}', fmt(Math.round(pj.equityH))).replace('{v}', fmt(Math.round(pj.valueH))).replace('{d}', fmt(Math.round(pj.balH)))
        : T.proj_equity_cash.replace('{v}', fmt(Math.round(pj.valueH))).replace('{g}', fmt(Math.round(pj.capitalGainH)));
      const retSentence = T.proj_return.replace('{ng}', fmtS(Math.round(pj.netGain))).replace('{e}', fmt(Math.round(pj.equityH))).replace('{cf}', fmtS(Math.round(pj.cumCF))).replace('{a}', fmt(Math.round(pj.apport)));

      const tblRows = pj.tableYears.map(y => {
        const s = pj.series[y];
        const cf = y === 0 ? null : pj.cfByYear[y];
        const payoff = showDebt && pj.loanYears > 0 && pj.loanYears <= y && (pj.tableYears[pj.tableYears.indexOf(y) - 1] ?? -1) < pj.loanYears;
        const yearLbl = (y === 0 ? T.proj_tbl_now : T.proj_tbl_yr.replace('{n}', y)) + (payoff ? T.proj_tbl_payoff_flag : '');
        return `<tr>
          <td>${yearLbl}</td>
          <td>${fmt(Math.round(s.value))}</td>
          <td>${showDebt ? fmt(Math.round(s.bal)) : '—'}</td>
          <td>${showDebt ? fmt(Math.round(s.paid)) : '—'}</td>
          <td class="${cf === null ? '' : cf >= 0 ? 'pos' : 'neg'}">${cf === null ? '—' : fmtS(Math.round(cf))}</td>
          <td class="hl">${fmt(Math.round(s.equity))}</td>
        </tr>`;
      }).join('');

      return `
    <div class="bsec">
      <div class="card-eyebrow" style="margin-bottom:8px">${T.proj_title}</div>
      ${projectionChart(pj)}
      <div class="proj-legend">
        <span class="proj-lg"><span class="proj-sw proj-sw-eq"></span>${T.proj_legend_equity}</span>
        ${showDebt ? `<span class="proj-lg"><span class="proj-sw proj-sw-debt"></span>${T.proj_legend_debt}</span>` : ''}
      </div>
      <p class="proj-summary">${eqSentence}</p>
      <p class="proj-summary">${retSentence}</p>
      <p class="proj-note">${T.proj_note.replace('{apprec}', pj.rate).replace('{infl}', pj.rentInfl)}</p>

      <div class="proj-tbl-wrap" style="margin-top:16px;overflow-x:auto">
        <div class="card-eyebrow" style="margin-bottom:8px">${T.proj_tbl_title}</div>
        <table class="scen-tbl">
          <thead><tr><th>${T.proj_tbl_year}</th><th>${T.proj_tbl_value}</th><th>${T.proj_tbl_debt}</th><th>${T.proj_tbl_paid}</th><th>${T.proj_tbl_cf}</th><th>${T.proj_tbl_equity}</th></tr></thead>
          <tbody>${tblRows}</tbody>
        </table>
      </div>
    </div>`;
    })() : ''}

    ${d.resale ? `
    <div class="bsec">
      <div class="card-eyebrow" style="margin-bottom:8px">${T.resale_title}</div>
      ${row(T.resale_price, null, d.resale.resalePrice)}
      ${row(T.resale_gain, T.resale_gain_hint, d.resale.capitalGain)}
      ${row(T.resale_tax, pct(IRNR_RATE * 100, 0), d.resale.capitalGainTax)}
      ${row(T.resale_withholding, T.resale_withholding_hint, d.resale.withholding)}
      <div class="brow">
        <div><div class="bname"><strong>${d.resale.balance >= 0 ? T.resale_balance_due : T.resale_balance_refund}</strong></div></div>
        <div class="bamt ${d.resale.balance >= 0 ? 'neg' : 'pos'}">${fmt(Math.abs(d.resale.balance))}</div>
      </div>
    </div>` : ''}

    ${d.notes.map(n => `<div class="sim-alert sa-info">ℹ️ ${n}</div>`).join('')}
    <div class="sim-alert sa-warn">${T.alert_excl}</div>
    <div class="sim-alert sa-info">${T.alert_disc}</div>

    <div style="margin:0 20px 14px">
      <details class="case">
        <summary>${T.region_compare_title}</summary>
        <div class="case-body">
          <table class="scen-tbl" style="width:100%">
            <thead><tr><th>${T.region_compare_region}</th><th>${T.region_compare_tax}</th><th>${T.region_compare_fees}</th><th>${T.region_compare_total}</th></tr></thead>
            <tbody>${regionCompareRows(d)}</tbody>
          </table>
        </div>
      </details>
    </div>

    <button class="btn-pdf" onclick="makePDF()">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="12" x2="12" y2="18"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
      ${T.btn_pdf}
    </button>`;
}

  doc.text(`${T.pdf_gen} ${now}`, 13, 34);

  let y = 49;
  const boxes = [[T.sec_taxes, fmt(d.totalTaxes)], [T.sec_fees, fmt(d.totalFees)], [T.total_lbl, fmt(d.totalInvest)], [T.tsplit_cash, fmt(d.cashNeeded)]];
  boxes.forEach(([l,v],i) => {
    const bx = 13 + i*46.5;
    doc.setFillColor(i>=2?240:243, i>=2?253:243, i>=2?244:239);

    doc.text(v, bx+22, y+10, { align:'center' });

    doc.text(l, bx+22, y+14.5, { align:'center', maxWidth:42 });
  });
  y += 25;

  function section(title, rows) {
    doc.setFillColor(243,243,239); doc.rect(13,y,184,6.5,'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(...NAVY);
    doc.text(title.toUpperCase(), 16, y+4.5); y += 9.5;
    rows.forEach(([n,det,amt]) => {
      doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...BLACK);
      doc.text(n, 16, y);
      if (det) { doc.setFontSize(7.5); doc.setTextColor(...GRAY); doc.text(det, 16, y+4); }
      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...BLACK);
      doc.text(amt, 194, y, { align:'right' });
      y += det ? 9 : 6.5;
      doc.setDrawColor(233,233,228); doc.line(13, y-1.5, 197, y-1.5);
    });

  }

  const tax = [[d.mainTaxName, d.mainTaxDetail, fmt(d.mainTax)]];
  if (d.hasAJD) tax.push([T.t_ajd_n, pct(d.region.ajd*100), fmt(d.ajd)]);
  section(T.sec_taxes, tax);

  const fees = [[T.f_notary, null, fmt(d.notary)]];
  if (d.agency) fees.push([T.f_agency, null, fmt(d.agency)]);
  if (d.works) fees.push([T.f_works, null, fmt(d.works)]);
  if (d.furniture) fees.push([T.f_furniture, null, fmt(d.furniture)]);
  fees.push([T.t_nie_n, null, fmt(NIE_COST)]);
  if (d.travel) fees.push([T.f_travel, null, fmt(d.travel)]);
  if (d.contingency) fees.push([T.f_contingency, null, fmt(d.contingency)]);
  if (d.mort) { fees.push([T.f_broker_fix, null, fmt(d.brokerFee)]); if (d.tasacion) fees.push([T.t_tasacion_n, null, fmt(d.tasacion)]); }
  section(T.sec_fees, fees);

  doc.setFillColor(...NAVY); doc.roundedRect(13, y, 184, 19, 2.5, 2.5, 'F');
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(178,193,215);
  doc.text(T.total_lbl, 19, y+7);
  doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(255,255,255);

  doc.setFontSize(7.5); doc.setTextColor(...GRAY);
  [[T.scen_min,120],[T.scen_real,155],[T.scen_max,192]].forEach(([l,x]) => doc.text(l, x, y, { align:'right' }));
  y += 4;
  doc.setDrawColor(200,199,192); doc.line(13, y-2, 197, y-2);

  const sc = d.scenarios;
  const pdfRow = (label, vals, bold) => {
    doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setFontSize(8.5);
    doc.setTextColor(...BLACK); doc.text(label, 16, y);

      const x = [120,155,192][i];

      doc.text(fmtS(v), x, y, { align:'right' });

    y += 5.5;
    doc.setDrawColor(238,238,233); doc.line(13, y-1.8, 197, y-1.8);
  };
  pdfRow(T.r_gross, sc.map(s => s.gross));
  pdfRow(T.r_vacancy, sc.map(s => -s.vacancy));
  pdfRow(T.r_net_rent, sc.map(s => s.collected), false);
  if (d.mort) pdfRow(T.r_mortgage, sc.map(s => -s.mortgageY));
  pdfRow(T.r_community, sc.map(() => -d.community));
  pdfRow(T.r_ibi, sc.map(() => -d.ibi));
  pdfRow(T.r_ins, sc.map(() => -d.insurance));
  pdfRow(T.r_mgmt, sc.map(s => -s.mgmt));
  pdfRow(T.r_unpaid, sc.map(s => -s.unpaid));
  pdfRow(T.r_irnr, sc.map(s => -s.irnr));
  y += 1;
  pdfRow(T.r_cf_year, sc.map(s => s.cfYear), true);
  pdfRow(T.r_cf_month, sc.map(s => s.cfMonth), true);

  y += 4;
  doc.setFillColor(249,249,247); doc.roundedRect(13, y, 184, 13, 2, 2, 'F');
  doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(...GRAY);
  doc.text(T.kpi_gross_yield, 30, y+5, { align:'center' });
  doc.text(T.kpi_net_yield, 105, y+5, { align:'center' });
  doc.text(T.kpi_cf, 180, y+5, { align:'center' });

  doc.text(pct(d.grossYield), 30, y+10.5, { align:'center' });
  doc.setTextColor(...(d.netYield >= 0 ? GREEN : RED));
  doc.text(pct(d.netYield), 105, y+10.5, { align:'center' });
  doc.setTextColor(...(d.real.cfMonth >= 0 ? GREEN : RED));
  doc.text(fmtS(d.real.cfMonth), 180, y+10.5, { align:'center' });

  doc.setFont('helvetica','normal'); doc.setFontSize(6.5); doc.setTextColor(...GRAY);
  const disc = doc.splitTextToSize(T.foot_disc, 180);
  doc.text(disc, 105, 284, { align:'center' });
  doc.text(`${T.brand_name} · ${T.pdf_gen} ${now}`, 105, 293, { align:'center' });

  doc.save(`${T.brand_name.toLowerCase().replace(/\s+/g,'-')}-${d.regionId}-${Math.round(d.price/1000)}k.pdf`);
}

/* Autocomplétion ville maison : la liste n'apparaît qu'à partir de la saisie (pas au clic).
   Choisir une ville pré-remplit la région. */
(function cityAutocomplete() {
  const input = $('city'), list = $('city-ac');
  let matches = [], active = -1;

  const close = () => { list.classList.remove('open'); input.setAttribute('aria-expanded', 'false'); active = -1; };
  const pick = c => {
    input.value = c.n;
    if ($('region').value !== c.r) $('region').value = c.r;
    close(); recalcDefaults();
  };
  const render = () => {
    if (!matches.length) { close(); return; }
    list.innerHTML = matches.map((c, i) =>
      `<span class="ac-item${i === active ? ' active' : ''}" data-i="${i}"><span>${c.n}</span><span class="ac-region">${REGIONS[c.r].name}</span></span>`).join('');
    list.classList.add('open'); input.setAttribute('aria-expanded', 'true');
  };

  input.addEventListener('input', () => {
    const q = cityNorm(input.value);
    matches = q.length >= 1 ? CITIES.filter(c => cityNorm(c.n).includes(q)).slice(0, 8) : [];
    active = -1; render();
    const exact = cityLookup(input.value);      // frappe complète = maj région/loyer en direct
    if (exact && $('region').value !== exact.r) $('region').value = exact.r;
    recalcDefaults();
  });
  input.addEventListener('keydown', e => {
    if (!list.classList.contains('open')) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(active + 1, matches.length - 1); render(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(active - 1, 0); render(); }
    else if (e.key === 'Enter' && active >= 0) { e.preventDefault(); pick(matches[active]); }
    else if (e.key === 'Escape') close();
  });
  list.addEventListener('mousedown', e => {           // mousedown avant le blur
    const it = e.target.closest('.ac-item');
    if (it) { e.preventDefault(); pick(matches[+it.dataset.i]); }
  });
  input.addEventListener('blur', () => setTimeout(close, 120));
})();

/* Filet de secours tant que FORMSPREE_URL n'est pas configuré : ouvre le client mail
   du visiteur, pré-rempli, plutôt que de perdre l'intérêt silencieusement. */
function mailtoFallback(visitorEmail) {
  const subject = encodeURIComponent('Nouvel intérêt — ' + document.title);
  const body = encodeURIComponent(`Un visiteur souhaite recevoir des informations.\nEmail renseigné : ${visitorEmail}`);
  const a = document.createElement('a');
  a.href = `mailto:${CONTACT_EMAIL}?subject=${subject}&body=${body}`;
  a.click();
}

$('interest-form').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = $('interest-msg');
  const visitorEmail = $('interest-email').value.trim();
  makeChecklistPDF();                       // le PDF se télécharge toujours
  msg.textContent = T.interest_success;
  msg.className = 'interest-msg show ok';
  // Capture de l'email si Formspree est configuré ; sinon, filet de secours par mailto (sans bloquer le téléchargement)
  if (!FORMSPREE_URL.includes('YOUR_FORM_ID')) {
    try { await fetch(FORMSPREE_URL, { method: 'POST', headers: { 'Accept': 'application/json' }, body: new FormData(e.target) }); } catch (err) {}
  } else if (visitorEmail) {
    mailtoFallback(visitorEmail);
  }
  e.target.reset();
});
